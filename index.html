<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paper Library</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    background: #0D1B2A;
    color: #C2DCF0;
    line-height: 1.6;
  }

  /* ─── Layout ─── */
  .app { display: flex; height: 100vh; }
  .left {
    flex: 1;
    min-width: 0;
    overflow-y: auto;
    transition: flex 0.25s ease;
  }
  .right {
    width: 0;
    background: #1a1a1a;
    border-left: 2px solid #02C39A;
    display: flex;
    flex-direction: column;
    transition: width 0.25s ease;
  }
  .app.split .left { flex: 0 0 50%; }
  .app.split .right { width: 50%; }
  .right-head {
    display: flex;
    align-items: center;
    padding: 8px 12px;
    background: #0E2030;
    border-bottom: 1px solid #1C3454;
    font-size: 12px;
    color: #7BB8CC;
    gap: 10px;
  }
  .right-head .title {
    flex: 1;
    color: #FFFFFF;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .close-btn {
    background: transparent;
    border: 1px solid #1C3454;
    color: #F87171;
    padding: 3px 10px;
    border-radius: 3px;
    cursor: pointer;
    font-size: 12px;
    font-family: inherit;
  }
  .close-btn:hover { border-color: #F87171; }
  .close-btn kbd {
    display: inline-block;
    margin-left: 6px;
    padding: 1px 5px;
    font: 600 10px/1 ui-monospace, SFMono-Regular, monospace;
    color: #A3B3C8;
    background: rgba(28, 52, 84, 0.6);
    border: 1px solid #1C3454;
    border-bottom-width: 2px;
    border-radius: 3px;
    letter-spacing: 0.5px;
    vertical-align: baseline;
  }
  .close-btn:hover kbd { color: #F87171; border-color: #F87171; }
  .pdf-frame { flex: 1; border: none; background: #1a1a1a; }

  header {
    padding: 20px 36px 14px;
    border-bottom: 1px solid #1A3048;
    background: linear-gradient(180deg, #0E2030 0%, #0D1B2A 100%);
  }
  .header-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
  }
  h1 { margin: 0 0 6px; font-size: 22px; color: #FFFFFF; font-weight: 700; }
  header .sub { color: #6A9BBF; font-size: 12.5px; }
  header .meta { color: #4B7A9E; font-size: 11.5px; margin-top: 3px; }

  .actions {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .btn {
    padding: 7px 14px;
    font-size: 12.5px;
    border-radius: 4px;
    cursor: pointer;
    font-family: inherit;
    font-weight: 600;
    border: 1px solid;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .btn-primary { background: #02C39A; color: #0D1B2A; border-color: #02C39A; }
  .btn-primary:hover { filter: brightness(1.1); }
  .btn-ghost { background: transparent; color: #7BB8CC; border-color: #1C3454; }
  .btn-ghost:hover { color: #FFFFFF; border-color: #3381D4; }
  .save-indicator {
    font-size: 11px;
    color: #6A9BBF;
    min-width: 60px;
    text-align: right;
  }
  .save-indicator.saving { color: #F6C344; }
  .save-indicator.saved { color: #02C39A; }
  .save-indicator.error { color: #F87171; }

  .filters {
    padding: 12px 36px;
    border-bottom: 1px solid #1A3048;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
    background: #0D1B2A;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .filters input {
    flex: 1;
    min-width: 180px;
    padding: 7px 12px;
    background: #0E2030;
    border: 1px solid #1C3454;
    color: #C2DCF0;
    border-radius: 4px;
    font-size: 12.5px;
    outline: none;
  }
  .filters input:focus { border-color: #02C39A; }
  .filter-btn {
    padding: 5px 12px;
    background: #0E2030;
    border: 1px solid #1C3454;
    color: #7BB8CC;
    border-radius: 999px;
    font-size: 11.5px;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .filter-btn:hover { border-color: #3381D4; color: #FFFFFF; }
  .filter-btn.active { background: #02C39A; color: #0D1B2A; border-color: #02C39A; font-weight: 600; }

  .filter-divider {
    width: 1px;
    height: 18px;
    background: #1C3454;
    margin: 0 4px;
  }
  .view-toggle {
    display: inline-flex;
    background: #0E2030;
    border: 1px solid #1C3454;
    border-radius: 999px;
    overflow: hidden;
  }
  .view-toggle button {
    padding: 5px 12px;
    background: transparent;
    border: none;
    color: #7BB8CC;
    font-size: 11.5px;
    cursor: pointer;
    font-family: inherit;
  }
  .view-toggle button.active { background: #3381D4; color: #FFFFFF; font-weight: 600; }

  /* ── Abstract List View ── */
  .abstract-list { padding: 0 36px 40px; }
  .abstract-item {
    display: grid;
    grid-template-columns: 280px 1fr;
    gap: 20px;
    padding: 18px 0;
    border-bottom: 1px solid #1A3048;
    transition: background 0.15s;
  }
  .abstract-item:hover { background: rgba(14, 32, 48, 0.4); }
  .abstract-item:first-child { padding-top: 10px; }
  .abstract-left { padding-left: 4px; }
  .abstract-title {
    font-size: 13.5px;
    font-weight: 700;
    color: #FFFFFF;
    line-height: 1.4;
    margin-bottom: 6px;
  }
  .abstract-short {
    color: var(--accent, #02C39A);
    margin-right: 6px;
  }
  .abstract-meta-row {
    display: flex;
    gap: 5px;
    flex-wrap: wrap;
    margin-bottom: 8px;
  }
  .abstract-links {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-top: 8px;
  }
  .abstract-right {
    color: #A3BFD4;
    font-size: 12.5px;
    line-height: 1.75;
    padding-right: 4px;
  }
  .abstract-right .abstract-label {
    color: #7BB8CC;
    font-size: 10.5px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 4px;
  }
  .abstract-text {
    white-space: pre-wrap;
    word-break: break-word;
    cursor: text;
    user-select: text;
  }
  .abstract-text-cn {
    color: #E2E8F0;
    line-height: 1.75;
  }
  .highlight-yellow {
    background: linear-gradient(180deg, rgba(255, 235, 59, 0.35) 0%, rgba(255, 235, 59, 0.25) 100%);
    border-bottom: 2px solid rgba(255, 235, 59, 0.6);
    border-radius: 2px;
    padding: 1px 2px;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .highlight-yellow:hover {
    background: linear-gradient(180deg, rgba(255, 235, 59, 0.5) 0%, rgba(255, 235, 59, 0.35) 100%);
    border-bottom-color: rgba(255, 235, 59, 0.9);
  }
  .abstract-keywords {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px dashed #1C3454;
  }
  .abstract-keywords .kw-tag {
    display: inline-block;
    background: rgba(2, 195, 154, 0.12);
    border: 1px solid rgba(2, 195, 154, 0.25);
    color: #68D8B5;
    padding: 2px 8px;
    border-radius: 3px;
    font-size: 10.5px;
    margin-right: 5px;
    margin-bottom: 4px;
  }
  .abstract-empty {
    text-align: center;
    padding: 60px 20px;
    color: #4B7A9E;
    font-size: 13px;
  }
  @media (max-width: 900px) {
    .abstract-item { grid-template-columns: 1fr; gap: 12px; }
  }

  /* ── Introduction List View ── */
  .intro-item .intro-text {
    max-height: 320px;
    overflow-y: auto;
    padding-right: 8px;
  }
  .intro-item .intro-text::-webkit-scrollbar { width: 4px; }
  .intro-item .intro-text::-webkit-scrollbar-track { background: transparent; }
  .intro-item .intro-text::-webkit-scrollbar-thumb { background: #1C3454; border-radius: 2px; }
  /* ─── Introduction Citation Links ─── */
  .intro-citation-link {
    color: #68D8B5;
    text-decoration: none;
    border-bottom: 1px dashed rgba(104, 216, 181, 0.4);
    transition: all 0.2s ease;
    cursor: pointer;
  }
  .intro-citation-link:hover {
    color: #02C39A;
    border-bottom: 1px solid #02C39A;
    background: rgba(2, 195, 154, 0.1);
    border-radius: 2px;
    padding: 0 2px;
  }

  .meta-row {
    display: flex;
    gap: 5px;
    flex-wrap: wrap;
    margin: 2px 0 6px;
  }
  .venue-badge,
  .ccf-badge,
  .track-badge {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    padding: 1px 6px;
    font-size: 9.5px;
    border-radius: 2px;
    vertical-align: middle;
    font-weight: 600;
  }
  .venue-badge.conference { background: #122C3E; color: #67E8F9; }
  .venue-badge.journal    { background: #1F2B16; color: #A7F3D0; }
  .venue-badge.preprint   { background: #312516; color: #FCD34D; }
  .venue-badge.workshop   { background: #2F2348; color: #C4B5FD; }
  .venue-badge.submission { background: #2A2430; color: #D8B4FE; }
  .venue-badge.other      { background: #1C3454; color: #B8C7D9; }
  .ccf-badge.rank-a { background: #0C3B2F; color: #5EEAD4; border: 1px solid rgba(94,234,212,0.25); }
  .ccf-badge.rank-b { background: #122B45; color: #93C5FD; border: 1px solid rgba(147,197,253,0.25); }
  .ccf-badge.rank-c { background: #342A14; color: #FCD34D; border: 1px solid rgba(252,211,77,0.25); }
  .ccf-badge.rank-na { background: #2A2530; color: #D1D5DB; border: 1px solid rgba(209,213,219,0.18); }
  .track-badge.main { background: #0C3B2F; color: #99F6E4; }
  .track-badge.journal { background: #1F2B16; color: #BBF7D0; }
  .track-badge.findings { background: #2A2848; color: #C4B5FD; }
  .track-badge.workshop { background: #302348; color: #D8B4FE; }
  .track-badge.demo { background: #263247; color: #93C5FD; }
  .track-badge.submission { background: #30222A; color: #FDA4AF; }
  .track-badge.preprint { background: #312516; color: #FCD34D; }
  .track-badge.other { background: #1C3454; color: #B8C7D9; }

  .org-badge {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    padding: 1px 6px;
    font-size: 9.5px;
    border-radius: 2px;
    margin-right: 4px;
    vertical-align: middle;
    font-weight: 600;
  }
  .org-badge.company { background: #2D1E3A; color: #C084FC; }
  .org-badge.school  { background: #112A3A; color: #60A5FA; }
  .org-badge.lab     { background: #2B1F14; color: #FBBF24; }

  main { padding: 14px 36px 40px; }
  .section { margin-top: 22px; }
  .section-head {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
    padding-bottom: 6px;
    border-bottom: 1px solid #1A3048;
  }
  .section-dot { width: 10px; height: 10px; border-radius: 50%; }
  .section-title { font-size: 15px; color: #FFFFFF; font-weight: 600; }
  .section-tag { color: #6A9BBF; font-size: 11.5px; font-style: italic; }
  .section-count { color: #4B7A9E; font-size: 11px; margin-left: auto; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 12px;
  }
  .card {
    background: #0E2030;
    border: 1px solid #1C3454;
    border-radius: 6px;
    overflow: hidden;
    transition: all 0.15s;
    display: flex;
    flex-direction: column;
    position: relative;
  }
  .card:hover {
    border-color: var(--accent);
    transform: translateY(-2px);
    box-shadow: 0 6px 16px rgba(0,0,0,0.4);
  }
  .card.active {
    border-color: var(--accent);
    border-width: 2px;
    box-shadow: 0 0 0 3px rgba(2, 195, 154, 0.25), 0 8px 20px rgba(0,0,0,0.5);
    background: #122943;
  }
  .card.active::before {
    content: "▶ 阅读中";
    position: absolute;
    top: 6px;
    right: 6px;
    background: var(--accent);
    color: #0D1B2A;
    font-size: 10px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 3px;
    z-index: 2;
    letter-spacing: 0.5px;
  }
  .card-thumb {
    width: 100%;
    aspect-ratio: 8.5 / 11;
    max-height: 200px;
    object-fit: cover;
    object-position: top center;
    background: #1C3454;
    cursor: pointer;
    border-bottom: 1px solid #1C3454;
    display: block;
  }
  .card-thumb-placeholder {
    width: 100%;
    aspect-ratio: 8.5 / 11;
    max-height: 200px;
    background: #1C3454;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #4B7A9E;
    font-size: 11px;
  }
  .card-thumb-wrap {
    position: relative;
    border-bottom: 1px solid #1C3454;
    background: #1C3454;
  }
  .card-thumb-wrap .card-thumb,
  .card-thumb-wrap .card-thumb-placeholder {
    border-bottom: none;
  }
  .paper-graph-btn {
    position: absolute;
    top: 34px;
    right: 6px;
    z-index: 5;
    width: 24px;
    height: 24px;
    border: 1px solid rgba(123, 184, 204, 0.45);
    background: rgba(9, 24, 39, 0.88);
    color: #9ACBDD;
    border-radius: 4px;
    cursor: pointer;
    font-size: 13px;
    line-height: 1;
    padding: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    opacity: 0.88;
    transition: opacity 0.15s, color 0.15s, border-color 0.15s, background 0.15s;
  }
  .card:hover .paper-graph-btn,
  .paper-graph-btn:focus-visible {
    opacity: 1;
  }
  .paper-graph-btn:hover {
    color: #0D1B2A;
    border-color: #68D8B5;
    background: #68D8B5;
  }
  .paper-note-btn {
    position: absolute;
    top: 62px;
    right: 6px;
    z-index: 5;
    width: 24px;
    height: 24px;
    border: 1px solid rgba(123, 184, 204, 0.45);
    background: rgba(9, 24, 39, 0.88);
    color: #9ACBDD;
    border-radius: 4px;
    cursor: pointer;
    font-size: 12px;
    line-height: 1;
    padding: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    opacity: 0.88;
    transition: opacity 0.15s, color 0.15s, border-color 0.15s, background 0.15s;
  }
  .card:hover .paper-note-btn,
  .paper-note-btn:focus-visible {
    opacity: 1;
  }
  .paper-note-btn:hover,
  .paper-note-btn.has-note {
    color: #0D1B2A;
    border-color: #F6C344;
    background: #F6C344;
  }
  .cover-rating {
    position: absolute;
    left: 8px;
    right: 8px;
    bottom: 8px;
    z-index: 5;
    display: flex;
    justify-content: center;
    gap: 1px;
    padding: 3px 5px;
    background: rgba(9, 24, 39, 0.78);
    border: 1px solid rgba(123, 184, 204, 0.28);
    border-radius: 5px;
    backdrop-filter: blur(4px);
  }
  .rating-star {
    position: relative;
    width: 18px;
    height: 19px;
    border: 0;
    background: transparent;
    padding: 0;
    cursor: pointer;
    font: inherit;
    font-size: 15px;
    line-height: 19px;
    color: #4B7A9E;
  }
  .rating-star .rating-base,
  .rating-star .rating-fill {
    position: absolute;
    inset: 0;
    display: block;
    text-align: center;
    pointer-events: none;
  }
  .rating-star .rating-fill {
    color: #F6C344;
    overflow: hidden;
    width: 0;
    white-space: nowrap;
  }
  .rating-star:hover .rating-base {
    color: #7BB8CC;
  }
  .card-body { padding: 12px 14px 14px; flex: 1; display: flex; flex-direction: column; }
  .card-title {
    font-size: 12.5px;
    font-weight: 700;
    color: #FFFFFF;
    line-height: 1.35;
    margin-bottom: 4px;
  }
  .card-title .short { color: var(--accent); margin-right: 5px; }
  .card-title .type-tag {
    display: inline-block;
    padding: 0 6px;
    border-radius: 2px;
    font-size: 9px;
    font-weight: 600;
    margin-right: 4px;
    background: #1C3454;
    color: #7BB8CC;
    vertical-align: middle;
  }
  .star { color: #F6C344; font-size: 11px; }
  /* ── Bulk select ── */
  .card.bulk-selected { border-color: #3381D4; box-shadow: 0 0 0 2px rgba(51,129,212,0.35); }
  .card-check {
    position: absolute; top: 6px; left: 6px; z-index: 4;
    width: 18px; height: 18px;
    accent-color: #3381D4;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.15s;
  }
  .card:hover .card-check,
  .card-check:checked { opacity: 1; }
  .card-check:checked ~ .card-star-btn { display: none; }
  #bulk-bar {
    display: none;
    position: fixed; bottom: 24px; right: 24px; z-index: 100;
    background: #0E2030;
    border: 1px solid #3381D4;
    border-radius: 8px;
    padding: 10px 14px;
    align-items: center;
    gap: 10px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
  }
  #bulk-bar.show { display: flex; }
  #bulk-bar select {
    background: #0D1B2A; border: 1px solid #3381D4; color: #FFFFFF;
    padding: 4px 8px; border-radius: 4px; font-size: 12px; font-family: inherit;
  }
  .bulk-count { color: #7BB8CC; font-size: 12px; }
  .card-star-btn {
    position: absolute;
    top: 6px;
    right: 6px;
    z-index: 3;
    background: rgba(13,27,42,0.7);
    border: none;
    border-radius: 3px;
    width: 22px;
    height: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 13px;
    padding: 0;
    color: #4B7A9E;
    opacity: 0;
    transition: opacity 0.15s, color 0.15s;
  }
  .card:hover .card-star-btn { opacity: 1; }
  .card-star-btn.starred { opacity: 1; color: #F6C344; }
  .card-note {
    font-size: 10.5px;
    color: #7BB8CC;
    margin: 4px 0 10px;
    line-height: 1.45;
    flex: 1;
  }
  .tag-row {
    display: flex;
    gap: 5px;
    flex-wrap: wrap;
    margin: 2px 0 7px;
  }
  .tag-pill {
    background: rgba(123, 184, 204, 0.12);
    border: 1px solid rgba(123, 184, 204, 0.24);
    color: #9ACBDD;
    border-radius: 3px;
    padding: 2px 6px;
    font-size: 9.5px;
    line-height: 1.2;
  }
  .card-controls {
    display: flex;
    gap: 6px;
    align-items: center;
    flex-wrap: wrap;
    margin-bottom: 8px;
  }
  .card-select {
    background: #0D1B2A;
    border: 1px solid var(--accent);
    color: var(--accent);
    padding: 3px 6px;
    border-radius: 3px;
    font-size: 10.5px;
    font-family: inherit;
    font-weight: 600;
    cursor: pointer;
    outline: none;
  }
  .card-select:hover { filter: brightness(1.2); }
  .icon-btn {
    background: transparent;
    border: 1px solid #1C3454;
    color: #6A9BBF;
    width: 22px;
    height: 22px;
    border-radius: 3px;
    cursor: pointer;
    font-size: 11px;
    padding: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-family: inherit;
  }
  .icon-btn:hover { color: #FFFFFF; border-color: #3381D4; }
  .icon-btn.danger:hover { color: #F87171; border-color: #F87171; }
  .card-links {
    display: flex;
    gap: 6px;
    align-items: center;
    flex-wrap: wrap;
  }
  .link {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    padding: 3px 9px;
    font-size: 10.5px;
    border-radius: 3px;
    text-decoration: none;
    font-weight: 500;
    cursor: pointer;
    font-family: inherit;
    border: none;
  }
  .link-pdf { background: var(--accent); color: #0D1B2A; }
  .link-pdf:hover { filter: brightness(1.15); }
  .link-arxiv {
    background: transparent;
    color: #7BB8CC;
    border: 1px solid #1C3454;
  }
  .link-arxiv:hover { border-color: #7BB8CC; color: #FFFFFF; }
  .arxiv-id {
    font-family: "SF Mono", monospace;
    font-size: 9.5px;
    color: #4B7A9E;
    margin-left: auto;
  }

  /* Modal */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(4px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
  }
  .modal-backdrop.show { display: flex; }
  .modal {
    background: #0E2030;
    border: 1px solid #1C3454;
    border-radius: 8px;
    padding: 24px;
    width: 90%;
    max-width: 520px;
    max-height: 90vh;
    overflow-y: auto;
  }
  .modal h2 {
    margin: 0 0 16px;
    font-size: 17px;
    color: #FFFFFF;
  }
  .field { margin-bottom: 12px; }
  .field label {
    display: block;
    font-size: 11.5px;
    color: #7BB8CC;
    margin-bottom: 4px;
    font-weight: 600;
  }
  .field input, .field textarea, .field select {
    width: 100%;
    padding: 7px 10px;
    background: #0D1B2A;
    border: 1px solid #1C3454;
    color: #C2DCF0;
    border-radius: 4px;
    font-size: 12.5px;
    font-family: inherit;
    outline: none;
  }
  .field input:focus, .field textarea:focus, .field select:focus { border-color: #02C39A; }
  .field textarea { resize: vertical; min-height: 60px; }
  .field-row { display: flex; gap: 10px; }
  .field-row .field { flex: 1; }
  .checkbox-field {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12.5px;
    color: #C2DCF0;
    cursor: pointer;
  }
  .checkbox-field input { width: auto; }
  .modal-actions {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
    margin-top: 20px;
  }

  .add-tab-btn {
    padding: 6px 14px;
    background: transparent;
    border: 1px solid #1C3454;
    color: #7BB8CC;
    border-radius: 4px;
    cursor: pointer;
    font-family: inherit;
    font-size: 12.5px;
    transition: all 0.15s;
    font-weight: 500;
  }
  .add-tab-btn.active { background: #02C39A; color: #0D1B2A; border-color: #02C39A; font-weight: 600; }
  .add-tab-btn:hover:not(.active) { border-color: #3381D4; color: #FFFFFF; }

  .graph-shell {
    display: grid;
    gap: 12px;
  }
  .graph-summary {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
    color: #7BB8CC;
    font-size: 11.5px;
  }
  .graph-pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 4px 9px;
    border: 1px solid #1C3454;
    background: #0E2030;
    border-radius: 999px;
    color: #9ACBDD;
    font-weight: 600;
  }
  .graph-layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 310px;
    gap: 12px;
    align-items: stretch;
  }
  .graph-canvas {
    min-height: 620px;
    background: #091827;
    border: 1px solid #1C3454;
    border-radius: 6px;
    overflow: hidden;
    position: relative;
  }
  .graph-svg {
    width: 100%;
    height: 620px;
    display: block;
  }
  .graph-side {
    background: #0E2030;
    border: 1px solid #1C3454;
    border-radius: 6px;
    padding: 14px;
    min-height: 620px;
    color: #C2DCF0;
  }
  .graph-side h3 {
    margin: 0 0 8px;
    color: #FFFFFF;
    font-size: 14px;
    line-height: 1.3;
  }
  .graph-side .muted {
    color: #6A9BBF;
    font-size: 11.5px;
    line-height: 1.55;
  }
  .graph-list {
    display: grid;
    gap: 6px;
    margin-top: 10px;
  }
  .graph-list-item {
    padding: 7px 8px;
    background: #0D1B2A;
    border: 1px solid #1C3454;
    border-radius: 4px;
    font-size: 11.5px;
    line-height: 1.35;
  }
  .graph-node { cursor: pointer; }
  .graph-node circle {
    stroke: #0D1B2A;
    stroke-width: 2.5;
    transition: stroke 0.15s, filter 0.15s, r 0.15s;
  }
  .graph-node:hover circle,
  .graph-node.selected circle {
    stroke: #FFFFFF;
    filter: drop-shadow(0 0 8px rgba(2,195,154,0.65));
  }
  .graph-node text {
    font-size: 10.5px;
    fill: #C2DCF0;
    paint-order: stroke;
    stroke: #091827;
    stroke-width: 3px;
    stroke-linejoin: round;
    pointer-events: none;
  }
  .graph-node.unresolved circle {
    fill: #1C3454;
    stroke-dasharray: 3 3;
    opacity: 0.85;
  }
  .graph-edge {
    stroke: #4B7A9E;
    stroke-opacity: 0.58;
    stroke-width: 1.4;
    marker-end: url(#graph-arrow);
  }
  .graph-edge.highlight {
    stroke: #02C39A;
    stroke-width: 2.2;
    stroke-opacity: 0.9;
  }
  .graph-empty {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    text-align: center;
    color: #7BB8CC;
    padding: 24px;
    pointer-events: none;
  }
  .graph-empty strong {
    display: block;
    color: #FFFFFF;
    margin-bottom: 6px;
    font-size: 14px;
  }
  @media (max-width: 900px) {
    .graph-layout { grid-template-columns: 1fr; }
    .graph-side { min-height: 0; }
  }

  .paper-graph-modal {
    width: min(1120px, 94vw);
    max-width: 1120px;
    padding: 0;
    overflow: hidden;
  }
  .paper-graph-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 14px;
    padding: 16px 18px;
    border-bottom: 1px solid #1C3454;
    background: #0B1728;
  }
  .paper-graph-head h2 {
    margin: 0 0 5px;
    font-size: 16px;
    line-height: 1.35;
  }
  .paper-graph-head .muted {
    color: #7BB8CC;
    font-size: 11.5px;
    line-height: 1.45;
  }
  .paper-graph-actions {
    display: flex;
    gap: 8px;
    flex-shrink: 0;
  }
  .paper-graph-body {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 340px;
    gap: 0;
    min-height: min(680px, 72vh);
  }
  .paper-graph-canvas {
    position: relative;
    min-height: 620px;
    background: #091827;
    border-right: 1px solid #1C3454;
    overflow: hidden;
  }
  .paper-radial-svg {
    width: 100%;
    height: min(680px, 72vh);
    min-height: 620px;
    display: block;
  }
  .paper-graph-panel {
    padding: 14px;
    overflow-y: auto;
    max-height: 72vh;
  }
  .paper-graph-panel h3 {
    margin: 0 0 8px;
    color: #FFFFFF;
    font-size: 14px;
    line-height: 1.35;
  }
  .paper-graph-panel .muted {
    color: #7BB8CC;
    font-size: 11.5px;
    line-height: 1.5;
  }
  .paper-graph-summary {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    padding: 12px 14px 0;
  }
  .paper-ref-list {
    display: grid;
    gap: 6px;
    margin-top: 12px;
  }
  .paper-ref-item {
    width: 100%;
    text-align: left;
    padding: 8px 9px;
    border: 1px solid #1C3454;
    background: #0D1B2A;
    color: #C2DCF0;
    border-radius: 5px;
    cursor: pointer;
    font: inherit;
    font-size: 11.5px;
    line-height: 1.35;
  }
  .paper-ref-item:hover,
  .paper-ref-item.active {
    border-color: #68D8B5;
  }
  .paper-ref-item .ref-meta {
    color: #6A9BBF;
    display: block;
    margin-top: 3px;
  }
  .paper-graph-node { cursor: pointer; }
  .paper-graph-node circle {
    stroke: #091827;
    stroke-width: 2.4;
    transition: stroke 0.15s, filter 0.15s;
  }
  .paper-graph-node:hover circle,
  .paper-graph-node.selected circle {
    stroke: #FFFFFF;
    filter: drop-shadow(0 0 8px rgba(104,216,181,0.65));
  }
  .paper-graph-node.center circle {
    stroke: #FFFFFF;
    stroke-width: 3;
  }
  .paper-graph-node.external circle {
    fill: #6A9BBF;
    opacity: 0.82;
  }
  .paper-graph-node text {
    font-size: 10px;
    fill: #C2DCF0;
    paint-order: stroke;
    stroke: #091827;
    stroke-width: 3px;
    stroke-linejoin: round;
    pointer-events: none;
  }
  .paper-radial-edge {
    stroke: #315A7A;
    stroke-opacity: 0.56;
    stroke-width: 1.2;
    marker-end: url(#paper-radial-arrow);
  }
  .paper-radial-edge.local {
    stroke: #68D8B5;
    stroke-opacity: 0.9;
    stroke-width: 1.7;
  }
  .paper-graph-loading,
  .paper-graph-error {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    text-align: center;
    padding: 24px;
    color: #9ACBDD;
    background: rgba(9, 24, 39, 0.72);
    pointer-events: none;
  }
  .paper-graph-error strong,
  .paper-graph-loading strong {
    display: block;
    color: #FFFFFF;
    margin-bottom: 6px;
    font-size: 14px;
  }
  @media (max-width: 900px) {
    .paper-graph-body { grid-template-columns: 1fr; }
    .paper-graph-canvas { border-right: none; border-bottom: 1px solid #1C3454; }
    .paper-graph-panel { max-height: none; }
  }

  .paper-note-modal {
    width: min(960px, 94vw);
    max-width: 960px;
    padding: 0;
    overflow: hidden;
  }
  .paper-note-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 14px;
    padding: 15px 18px;
    border-bottom: 1px solid #1C3454;
    background: #0B1728;
  }
  .paper-note-head h2 {
    margin: 0 0 5px;
    font-size: 16px;
    line-height: 1.35;
  }
  .paper-note-head .muted {
    color: #7BB8CC;
    font-size: 11.5px;
    line-height: 1.45;
  }
  .paper-note-actions {
    display: flex;
    gap: 8px;
    flex-shrink: 0;
    align-items: center;
  }
  .paper-note-status {
    color: #7BB8CC;
    font-size: 11.5px;
    white-space: nowrap;
  }
  .paper-note-toolbar {
    display: flex;
    gap: 6px;
    padding: 10px 18px;
    background: #0E2030;
    border-bottom: 1px solid #1C3454;
  }
  .note-tool {
    border: 1px solid #1C3454;
    background: #0D1B2A;
    color: #C2DCF0;
    min-width: 28px;
    height: 28px;
    border-radius: 4px;
    cursor: pointer;
    font: inherit;
    font-size: 12px;
    font-weight: 700;
  }
  .note-tool:hover {
    border-color: #68D8B5;
    color: #FFFFFF;
  }
  .paper-note-body {
    background: #D8E1EC;
    padding: 20px;
    max-height: 76vh;
    overflow-y: auto;
  }
  .paper-note-editor {
    width: min(760px, 100%);
    min-height: 620px;
    display: block;
    margin: 0 auto;
    border: 1px solid #B7C4D2;
    border-radius: 3px;
    background: #FFFFFF;
    color: #182536;
    box-shadow: 0 12px 32px rgba(13, 27, 42, 0.22);
    padding: 34px 40px;
    resize: vertical;
    outline: none;
    font: 14px/1.75 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .paper-note-editor:focus {
    border-color: #3381D4;
    box-shadow: 0 0 0 2px rgba(51, 129, 212, 0.18), 0 12px 32px rgba(13, 27, 42, 0.22);
  }
  @media (max-width: 720px) {
    .paper-note-head { flex-direction: column; }
    .paper-note-body { padding: 12px; }
    .paper-note-editor { padding: 24px 20px; min-height: 540px; }
  }

  footer {
    text-align: center;
    padding: 20px;
    color: #4B7A9E;
    font-size: 10.5px;
    border-top: 1px solid #1A3048;
  }

  .left::-webkit-scrollbar { width: 8px; }
  .left::-webkit-scrollbar-track { background: #0D1B2A; }
  .left::-webkit-scrollbar-thumb { background: #1C3454; border-radius: 4px; }
  .left::-webkit-scrollbar-thumb:hover { background: #3381D4; }

</style>
</head>
<body>

<div class="app" id="app">
  <div class="left">
    <header>
      <div class="header-top">
        <div>
          <h1 id="lib-title">Paper Library</h1>
          <div class="sub" id="lib-subtitle">按分类浏览 · 支持编辑分类 + 新增论文</div>
          <div class="meta">点击缩略图分屏预览 PDF · 修改后自动保存</div>
        </div>
        <div class="actions">
          <span class="save-indicator" id="save-indicator"></span>
          <button class="btn btn-ghost" onclick="openCategoryModal()">🏷️ 管理分类</button>
          <button class="btn btn-primary" onclick="openAddModal()">＋ 新增</button>
        </div>
      </div>
    </header>

    <div class="filters">
      <input type="text" id="search" placeholder="🔍 搜索标题、简称、机构、刊会、备注...">
      <div class="view-toggle" id="view-toggle">
        <button data-view="cat" class="active">按主题</button>
        <button data-view="graph">图模块</button>
        <button data-view="venueType">按发表类型</button>
        <button data-view="ccf">按 CCF</button>
        <button data-view="track">按形式</button>
        <button data-view="venue">按刊会</button>
        <button data-view="org">按机构</button>
        <button data-view="abstract">摘要列表</button>
        <button data-view="introduction">Introduction</button>
      </div>
      <span class="filter-divider"></span>
      <div id="filter-bar" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;"></div>
    </div>

    <main id="main"></main>

    <footer>
      数据文件：<code>papers.json</code> · 每次修改自动备份至 <code>.backup/</code>
    </footer>
  </div>

  <div id="bulk-bar">
    <span class="bulk-count" id="bulk-count">已选 0 篇</span>
    <select id="bulk-cat-select"></select>
    <button class="btn btn-primary" onclick="applyBulkCategory()">修改分类</button>
    <button class="btn btn-ghost" onclick="clearBulkSelect()">取消</button>
  </div>

  <div class="right" id="right">
    <div class="right-head">
      <span class="title" id="right-title">PDF 预览</span>
      <a id="right-open-ext" class="close-btn" style="display:none;margin-right:8px;text-decoration:none" target="_blank">↗ 新标签打开</a>
      <button class="close-btn" onclick="closePdf()" title="按 ESC 关闭分屏">✕ 关闭 <kbd>ESC</kbd></button>
    </div>
    <iframe class="pdf-frame" id="pdf-frame" src="" referrerpolicy="no-referrer"></iframe>
  </div>
</div>

<!-- ── Category Management Modal ── -->
<div class="modal-backdrop" id="cat-modal-backdrop">
  <div class="modal" style="max-width: 640px;">
    <h2>🏷️ 分类管理</h2>
    <div id="category-list" style="margin-bottom: 18px;"></div>
    <div style="border-top: 1px solid #1C3454; padding-top: 14px;">
      <h2 style="font-size: 14px; margin-bottom: 10px;" id="cat-form-title">新增分类</h2>
      <input type="hidden" id="cat-edit-id">
      <div class="field-row">
        <div class="field">
          <label>类名</label>
          <input type="text" id="cat-title" placeholder="例如 机器人操作">
        </div>
        <div class="field" style="flex: 0 0 110px;">
          <label>颜色</label>
          <input type="color" id="cat-color" value="#0AB5A8" style="padding: 3px; height: 34px;">
        </div>
      </div>
      <div class="field">
        <label>描述</label>
        <input type="text" id="cat-tag" placeholder="例如 抓取、放置、全身协同">
      </div>
      <div class="modal-actions">
        <button class="btn btn-ghost" onclick="resetCatForm()">重置</button>
        <button class="btn btn-primary" onclick="saveCategory()" id="cat-save-btn">添加</button>
      </div>
    </div>
    <div class="modal-actions" style="border-top: 1px solid #1C3454; padding-top: 14px;">
      <button class="btn btn-ghost" onclick="closeCategoryModal()">关闭</button>
    </div>
  </div>
</div>

<!-- ── Add / Edit Paper Modal ── -->
<div class="modal-backdrop" id="modal-backdrop">
  <div class="modal" style="max-width:680px">
    <h2 id="modal-title">新增论文 / 产品</h2>
    <div class="field">
      <label>类型</label>
      <span id="f-type-display" style="font-size:14px;color:var(--text)"></span>
      <input type="hidden" id="f-type">
    </div>
    <div class="field-row">
      <div class="field">
        <label>分类</label>
        <select id="f-cat"></select>
      </div>
      <div class="field">
        <label>简称</label>
        <input type="text" id="f-short" placeholder="例如 UMI 或 Figure02">
      </div>
    </div>
    <div class="field">
      <label>完整标题</label>
      <input type="text" id="f-title" placeholder="论文标题 或 产品全称">
    </div>
    <div class="field">
      <label>备注 / 描述</label>
      <textarea id="f-note" placeholder="机构 · 核心创新 · 关键指标"></textarea>
    </div>
    <div class="field-row">
      <div class="field">
        <label>发表刊会 / 期刊</label>
        <input type="text" id="f-venue" placeholder="例如 AAAI / EMNLP Findings / JAMIA">
      </div>
      <div class="field" style="flex: 0 0 130px;">
        <label>发表类型</label>
        <select id="f-venueType">
          <option value="">—</option>
          <option value="conference">会议</option>
          <option value="journal">期刊</option>
          <option value="preprint">预印本</option>
          <option value="workshop">Workshop</option>
          <option value="submission">投稿/审稿中</option>
          <option value="other">其他</option>
        </select>
      </div>
      <div class="field" style="flex: 0 0 105px;">
        <label>CCF</label>
        <select id="f-ccf">
          <option value="">待补充</option>
          <option value="A">A</option>
          <option value="B">B</option>
          <option value="C">C</option>
          <option value="N/A">未收录/不适用</option>
        </select>
      </div>
      <div class="field" style="flex: 0 0 125px;">
        <label>收录形式</label>
        <select id="f-venueTrack">
          <option value="">自动/待补充</option>
          <option value="main">主会/主刊</option>
          <option value="findings">Findings</option>
          <option value="workshop">Workshop</option>
          <option value="demo">Demo</option>
          <option value="submission">投稿/审稿中</option>
          <option value="preprint">arXiv/预印本</option>
          <option value="other">其他</option>
        </select>
      </div>
    </div>
    <div class="field-row">
      <div class="field">
        <label>所属机构</label>
        <input type="text" id="f-org" placeholder="例如 Stanford University / NVIDIA">
      </div>
      <div class="field" style="flex: 0 0 150px;">
        <label>机构类型</label>
        <select id="f-orgType">
          <option value="">—</option>
          <option value="school">🎓 学校</option>
          <option value="company">🏢 公司</option>
        </select>
      </div>
    </div>
    <div class="field-row" id="row-arxiv">
      <div class="field">
        <label>arXiv ID</label>
        <input type="text" id="f-arxiv" placeholder="例如 2402.10329">
      </div>
      <div class="field">
        <label>PDF 文件名</label>
        <input type="text" id="f-pdf" placeholder="放入 references/ 目录后填写">
      </div>
    </div>
    <div class="field" id="row-url" style="display:none">
      <label>产品/公司链接</label>
      <input type="text" id="f-url" placeholder="https://...">
    </div>
    <div class="field">
      <label>缩略图文件名</label>
      <input type="text" id="f-thumb" placeholder="例如 UMI_2402.10329-01.png">
    </div>
    <label class="checkbox-field">
      <input type="checkbox" id="f-star"> ★ 标记为收藏
    </label>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">取消</button>
      <button class="btn btn-ghost" id="delete-btn" style="display:none; color:#F87171; border-color:#1C3454;" onclick="deletePaper()">删除</button>
      <button class="btn btn-primary" onclick="savePaper()">保存</button>
    </div>
  </div>
</div>

<!-- ── Add Paper Modal (本地 PDF / arXiv / 网页) ── -->
<div class="modal-backdrop" id="add-modal-backdrop">
  <div class="modal" style="max-width:680px">
    <h2>＋ 新增论文</h2>
    <div style="display:flex;gap:6px;margin-bottom:16px">
      <button class="add-tab-btn active" data-tab="local" onclick="switchAddTab('local')">📁 本地 PDF</button>
      <button class="add-tab-btn" data-tab="arxiv" onclick="switchAddTab('arxiv')">📖 arXiv</button>
      <button class="add-tab-btn" data-tab="web" onclick="switchAddTab('web')">🏢 公司产品</button>
    </div>

    <!-- 本地 PDF tab -->
    <div id="add-tab-local">
      <div id="add-upload-zone" style="border:2px dashed #1C3454;border-radius:6px;padding:28px;text-align:center;cursor:pointer;transition:border-color 0.15s" onclick="document.getElementById('add-file').click()">
