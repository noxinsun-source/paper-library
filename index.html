<script>
let state = { meta: {}, categories: [], papers: [] };
let lastMtime = null;
let editingId = null;
let activePaperId = null;
let viewMode = "cat";
let activeFilter = "all";
let citationGraph = null;
let citationGraphLoading = false;
let citationGraphError = "";
let selectedGraphNodeId = null;
let paperGraphCache = new Map();
let paperGraphLoadingId = null;
let paperGraphError = "";
let currentPaperGraphId = null;
let selectedPaperGraphNodeId = null;
let editingNotePaperId = null;
let noteSaveTimer = null;

const main = document.getElementById("main");
const app = document.getElementById("app");
const pdfFrame = document.getElementById("pdf-frame");
const rightTitle = document.getElementById("right-title");
const indicator = document.getElementById("save-indicator");

const VENUE_TYPE_META = {
  conference: { label: "会议", color: "#22D3EE", cls: "conference", order: 0 },
  journal: { label: "期刊", color: "#34D399", cls: "journal", order: 1 },
  preprint: { label: "预印本", color: "#F59E0B", cls: "preprint", order: 2 },
  workshop: { label: "Workshop", color: "#A78BFA", cls: "workshop", order: 3 },
  submission: { label: "投稿/审稿中", color: "#D8B4FE", cls: "submission", order: 4 },
  other: { label: "其他", color: "#94A3B8", cls: "other", order: 5 },
  "": { label: "未填写发表类型", color: "#64748B", cls: "other", order: 9 },
};
const CCF_META = {
  A: { label: "CCF A", color: "#5EEAD4", cls: "rank-a", order: 0 },
  B: { label: "CCF B", color: "#93C5FD", cls: "rank-b", order: 1 },
  C: { label: "CCF C", color: "#FCD34D", cls: "rank-c", order: 2 },
  "N/A": { label: "未收录/不适用", color: "#D1D5DB", cls: "rank-na", order: 3 },
  "": { label: "待补充 CCF", color: "#64748B", cls: "rank-na", order: 4 },
};
const VENUE_TRACK_META = {
  main: { label: "主会/主刊", color: "#5EEAD4", cls: "main", order: 0 },
  journal: { label: "期刊正刊", color: "#86EFAC", cls: "journal", order: 1 },
  findings: { label: "Findings", color: "#C4B5FD", cls: "findings", order: 2 },
  workshop: { label: "Workshop", color: "#D8B4FE", cls: "workshop", order: 3 },
  demo: { label: "Demo", color: "#93C5FD", cls: "demo", order: 4 },
  submission: { label: "投稿/审稿中", color: "#FDA4AF", cls: "submission", order: 5 },
  preprint: { label: "arXiv/预印本", color: "#FCD34D", cls: "preprint", order: 6 },
  other: { label: "其他形式", color: "#B8C7D9", cls: "other", order: 7 },
  "": { label: "待补充形式", color: "#64748B", cls: "other", order: 8 },
};
const CCF_BY_VENUE = {
  AAAI: "A",
  ACL: "A",
  ICML: "A",
  ICLR: "A",
  IJCAI: "A",
  KDD: "A",
  SIGKDD: "A",
  WWW: "A",
  EMNLP: "B",
  COLING: "B",
  JAMIA: "B",
  MICCAI: "B",
  "JBI": "C",
  "ARTIFICIAL INTELLIGENCE IN MEDICINE": "C",
};

function normalizeVenueType(value) {
  return VENUE_TYPE_META[value] ? value : "";
}

function getVenueTypeMeta(value) {
  return VENUE_TYPE_META[normalizeVenueType(value)] || VENUE_TYPE_META[""];
}

function normalizeVenueTrack(value) {
  return VENUE_TRACK_META[value] ? value : "";
}

function getVenueTrackMeta(value) {
  return VENUE_TRACK_META[normalizeVenueTrack(value)] || VENUE_TRACK_META[""];
}

function getVenueName(p) {
  return (p.venue || "").trim();
}

function getCcfRank(p) {
  const rank = (p.ccf || "").trim().toUpperCase();
  return CCF_META[rank] ? rank : "";
}

function getCcfMeta(rank) {
  return CCF_META[CCF_META[rank] ? rank : ""];
}

function inferCcfFromVenue(venue) {
  const text = String(venue || "").toUpperCase();
  if (!text) return "";
  if (/\b(BIORXIV|MEDRXIV|RESEARCHGATE)\b/.test(text)) return "N/A";
  for (const [key, rank] of Object.entries(CCF_BY_VENUE)) {
    if (text.includes(key)) return rank;
  }
  return "";
}

function inferVenueTrack(venue, venueType) {
  const text = String(venue || "").toUpperCase();
  if (/\bFINDINGS\b/.test(text)) return "findings";
  if (/\b(WORKSHOP|BRIDGE|NEUSYMBRIDGE|GENBIO)\b/.test(text)) return "workshop";
  if (/\bDEMO\b/.test(text)) return "demo";
  if (/\b(ARR|SUBMISSION|OPENREVIEW)\b/.test(text)) return "submission";
  if (/\b(ARXIV|BIORXIV|MEDRXIV|RESEARCHGATE)\b/.test(text)) return "preprint";
  if (venueType === "journal") return "journal";
  if (venueType === "preprint") return "preprint";
  if (venueType === "submission") return "submission";
  if (venueType === "workshop") return "workshop";
  if (venueType === "conference") return "main";
  return "";
}

function getVenueTrack(p) {
  const explicit = normalizeVenueTrack(p.venueTrack);
  return explicit || inferVenueTrack(getVenueName(p), normalizeVenueType(p.venueType));
}

function maybeFillCcfFromVenue(prefix) {
  const venue = document.getElementById(`${prefix}-venue`)?.value || "";
  const venueType = document.getElementById(`${prefix}-venueType`)?.value || "";
  const ccfEl = document.getElementById(`${prefix}-ccf`);
  const trackEl = document.getElementById(`${prefix}-venueTrack`);
  if (ccfEl && !ccfEl.value) {
    const inferred = inferCcfFromVenue(venue);
    if (inferred) ccfEl.value = inferred;
  }
  if (trackEl && !trackEl.value) {
    const inferredTrack = inferVenueTrack(venue, venueType);
    if (inferredTrack) trackEl.value = inferredTrack;
  }
}

function countBy(items, keyFn) {
  const counts = new Map();
  items.forEach(item => {
    const key = keyFn(item);
    counts.set(key, (counts.get(key) || 0) + 1);
  });
  return counts;
}

// ── API ──
async function loadData() {
  const res = await fetch("/api/papers");
  lastMtime = res.headers.get("X-Mtime");
  state = await res.json();
  if (!state.meta) state.meta = {};
  if (state.meta.title) document.getElementById("lib-title").textContent = state.meta.title;
  if (state.meta.subtitle) document.getElementById("lib-subtitle").textContent = state.meta.subtitle;
  renderFilterBar();
  populateCatSelect();
  render();
}

async function saveData() {
  indicator.textContent = "保存中...";
  indicator.className = "save-indicator saving";
  try {
    const headers = { "Content-Type": "application/json" };
    if (lastMtime) headers["X-If-Mtime"] = lastMtime;
    const res = await fetch("/api/papers", {
      method: "PUT",
      headers,
      body: JSON.stringify(state),
    });
    if (res.status === 409) {
      indicator.textContent = "⚠ 已过期";
      indicator.className = "save-indicator error";
      if (confirm("文件在别处被修改过，你当前的改动将覆盖掉它们。\n点『确定』刷新重新加载最新数据（你本次未保存的改动会丢失）；\n点『取消』保留当前改动。")) {
        await loadData();
      }
      return;
    }
    if (!res.ok) throw new Error(await res.text());
    const mt = res.headers.get("X-Mtime");
    if (mt) lastMtime = mt;
    indicator.textContent = "✓ 已保存";
    indicator.className = "save-indicator saved";
    setTimeout(() => { indicator.textContent = ""; indicator.className = "save-indicator"; }, 1500);
  } catch (e) {
    indicator.textContent = "✗ 失败";
    indicator.className = "save-indicator error";
    alert("保存失败: " + e.message);
  }
}

// ── Render ──
function escapeHtml(s) {
  return String(s ?? "").replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function renderFilterBar() {
  const bar = document.getElementById("filter-bar");
  bar.innerHTML = "";
  const addFilterBtn = (filter, label) => {
    const btn = document.createElement("button");
    btn.className = "filter-btn" + (activeFilter === filter ? " active" : "");
    btn.dataset.filter = filter;
    btn.textContent = label;
    bar.appendChild(btn);
  };

  addFilterBtn("all", `全部 (${state.papers.length})`);

  const starCount = state.papers.filter(p => p.star).length;
  addFilterBtn("starred", `★ 收藏 (${starCount})`);

  if (viewMode === "graph") {
    addFilterBtn("graph:connected", "有本地引用关系");
    addFilterBtn("graph:unresolved", "未匹配 OpenAlex");
    const refreshBtn = document.createElement("button");
    refreshBtn.className = "filter-btn";
    refreshBtn.textContent = citationGraphLoading ? "正在更新..." : "更新引用图";
    refreshBtn.disabled = citationGraphLoading;
    refreshBtn.onclick = () => loadCitationGraph(true);
    bar.appendChild(refreshBtn);
  } else if (viewMode === "cat") {
    state.categories.forEach(c => {
      const count = state.papers.filter(p => p.cat === c.id).length;
      addFilterBtn(c.id, `${c.title} (${count})`);
    });
  } else if (viewMode === "abstract") {
    state.categories.forEach(c => {
      const count = state.papers.filter(p => p.cat === c.id).length;
      addFilterBtn(c.id, `${c.title} (${count})`);
    });
  } else if (viewMode === "introduction") {
    state.categories.forEach(c => {
      const count = state.papers.filter(p => p.cat === c.id).length;
      addFilterBtn(c.id, `${c.title} (${count})`);
    });
  } else if (viewMode === "org") {
    const companyCount = state.papers.filter(p => p.orgType === "company").length;
    const schoolCount = state.papers.filter(p => p.orgType === "school").length;
    const labCount = state.papers.filter(p => p.orgType === "lab").length;
    [
      { k: "type:company", label: `🏢 公司 (${companyCount})` },
      { k: "type:school",  label: `🎓 学校 (${schoolCount})` },
    ].concat(labCount ? [{ k: "type:lab", label: `🔬 实验室 (${labCount})` }] : []).forEach(o => {
      addFilterBtn(o.k, o.label);
    });
  } else if (viewMode === "venueType") {
    const counts = countBy(state.papers, p => normalizeVenueType(p.venueType));
    Object.entries(VENUE_TYPE_META)
      .sort((a, b) => a[1].order - b[1].order)
      .forEach(([key, meta]) => {
        const count = counts.get(key) || 0;
        if (count > 0) addFilterBtn(`venueType:${key || "__blank__"}`, `${meta.label} (${count})`);
      });
  } else if (viewMode === "ccf") {
    const counts = countBy(state.papers, p => getCcfRank(p));
    Object.entries(CCF_META)
      .sort((a, b) => a[1].order - b[1].order)
      .forEach(([key, meta]) => {
        const count = counts.get(key) || 0;
        if (count > 0) addFilterBtn(`ccf:${key || "__blank__"}`, `${meta.label} (${count})`);
      });
  } else if (viewMode === "track") {
    const counts = countBy(state.papers, p => getVenueTrack(p));
    Object.entries(VENUE_TRACK_META)
      .sort((a, b) => a[1].order - b[1].order)
      .forEach(([key, meta]) => {
        const count = counts.get(key) || 0;
        if (count > 0) addFilterBtn(`track:${key || "__blank__"}`, `${meta.label} (${count})`);
      });
  } else if (viewMode === "venue") {
    const counts = countBy(state.papers, p => getVenueName(p) || "（未填写刊会）");
    [...counts.entries()]
      .sort((a, b) => {
        if (a[0] === "（未填写刊会）") return 1;
        if (b[0] === "（未填写刊会）") return -1;
        if (b[1] !== a[1]) return b[1] - a[1];
        return a[0].localeCompare(b[0]);
      })
      .forEach(([venue, count]) => {
        addFilterBtn(`venue:${encodeURIComponent(venue)}`, `${venue} (${count})`);
      });
  }

  bar.querySelectorAll(".filter-btn").forEach(btn => {
    btn.onclick = () => {
      activeFilter = btn.dataset.filter;
      bar.querySelectorAll(".filter-btn").forEach(b => b.classList.toggle("active", b.dataset.filter === activeFilter));
      render();
    };
  });
}

function setViewMode(mode) {
  viewMode = mode;
  activeFilter = "all";
  document.querySelectorAll("#view-toggle button").forEach(b => b.classList.toggle("active", b.dataset.view === mode));
  renderFilterBar();
  render();
}

function populateCatSelect() {
  const sel = document.getElementById("f-cat");
  sel.innerHTML = state.categories.map(c => `<option value="${c.id}">${c.title}</option>`).join("");
}

function openPdf(pdfName, title, paperId) {
  if (!pdfName) return;
  pdfFrame.removeAttribute("srcdoc");
  pdfFrame.src = "references/" + pdfName;
  rightTitle.textContent = title;
  const extBtn = document.getElementById("right-open-ext");
  extBtn.href = "references/" + pdfName;
  extBtn.style.display = "inline-block";
  app.classList.add("split");
  activePaperId = paperId || null;
  updateActiveCard();
}

function openUrl(url, title, paperId) {
  if (!url) return;
  const safeUrl = escapeHtml(url);
  pdfFrame.removeAttribute("srcdoc");
  pdfFrame.src = url;
  rightTitle.textContent = title || '外部页面';
  const extBtn = document.getElementById("right-open-ext");
  extBtn.href = url;
  extBtn.style.display = "inline-block";
  extBtn.textContent = '↗ 新标签打开';
  app.classList.add("split");
  activePaperId = paperId || null;
  updateActiveCard();
}

function openCiteUrl(url, title) {
  if (!url) return;
  pdfFrame.removeAttribute("srcdoc");
  pdfFrame.src = url;
  rightTitle.textContent = title || '引用论文';
  const extBtn = document.getElementById("right-open-ext");
  extBtn.href = url;
  extBtn.style.display = "inline-block";
  extBtn.textContent = '↗ 新标签打开';
  app.classList.add("split");
}

function closePdf() {
  app.classList.remove("split");
  setTimeout(() => { pdfFrame.removeAttribute("srcdoc"); pdfFrame.src = ""; }, 250);
  document.getElementById("right-open-ext").style.display = "none";
  activePaperId = null;
  updateActiveCard();
}

function updateActiveCard() {
  document.querySelectorAll(".card").forEach(c => c.classList.remove("active"));
  if (activePaperId) {
    const el = document.querySelector(`.card[data-id="${CSS.escape(activePaperId)}"]`);
    if (el) el.classList.add("active");
  }
}

function changeCategory(id, newCat, sel) {
  if (newCat === '__new__') {
    if (sel) { const p = state.papers.find(x=>x.id===id); if (p) sel.value = p.cat; }
    openCategoryModal();
    return;
  }
  const p = state.papers.find(x => x.id === id);
  if (!p) return;
  p.cat = newCat;
  saveData();
  renderFilterBar();
  render();
}

function toggleStar(id) {
  const p = state.papers.find(x => x.id === id);
  if (!p) return;
  p.star = !p.star;
  saveData();
  render();
}

function normalizeRating(value) {
  const n = Number(value) || 0;
  return Math.max(0, Math.min(5, Math.round(n * 2) / 2));
}

function setRatingFromClick(event, id, starIndex) {
  const p = state.papers.find(x => x.id === id);
  if (!p) return;
  const rect = event.currentTarget.getBoundingClientRect();
  const next = starIndex - (event.clientX - rect.left < rect.width / 2 ? 0.5 : 0);
  const current = normalizeRating(p.rating);
  p.rating = current === next ? null : next;
  saveData();
  render();
}

function renderRatingControl(p) {
  const rating = normalizeRating(p.rating);
  const label = rating ? `${rating} / 5` : "未评分";
  return `<div class="cover-rating" title="${escapeHtml(label)}">
    ${[1, 2, 3, 4, 5].map(i => {
      const fill = Math.max(0, Math.min(1, rating - (i - 1))) * 100;
      return `<button class="rating-star" title="${i - 0.5} / ${i} 星" onclick='setRatingFromClick(event, ${JSON.stringify(p.id)}, ${i})'>
        <span class="rating-base">★</span>
        <span class="rating-fill" style="width:${fill}%">★</span>
      </button>`;
    }).join("")}
  </div>`;
}

function matchQuery(p, q) {
  if (!q) return true;
  const tags = Array.isArray(p.tags) ? p.tags.join(" ").toLowerCase() : "";
  const venue = getVenueName(p).toLowerCase();
  const venueType = getVenueTypeMeta(p.venueType).label.toLowerCase();
  const venueTrack = getVenueTrackMeta(getVenueTrack(p)).label.toLowerCase();
  const ccf = getCcfMeta(getCcfRank(p)).label.toLowerCase();
  return (p.title?.toLowerCase().includes(q) || p.short?.toLowerCase().includes(q) ||
          p.note?.toLowerCase().includes(q) || p.org?.toLowerCase().includes(q) ||
          p.readingNote?.toLowerCase().includes(q) ||
          venue.includes(q) || venueType.includes(q) || venueTrack.includes(q) ||
          ccf.includes(q) || tags.includes(q));
}

function getGraphNode(id) {
  return citationGraph?.nodes?.find(n => n.id === id) || null;
}

function graphNodeHasLocalEdge(id) {
  return !!citationGraph?.edges?.some(e => e.source === id || e.target === id);
}

function matchesActiveFilter(p) {
  if (activeFilter === "all") return true;
  if (activeFilter === "starred") return !!p.star;
  if (activeFilter === "graph:connected") return graphNodeHasLocalEdge(p.id);
  if (activeFilter === "graph:unresolved") return getGraphNode(p.id)?.resolved === false;
  if (activeFilter.startsWith("type:")) return p.orgType === activeFilter.slice(5);
  if (activeFilter.startsWith("venueType:")) {
    const key = activeFilter.slice("venueType:".length);
    return normalizeVenueType(p.venueType) === (key === "__blank__" ? "" : key);
  }
  if (activeFilter.startsWith("ccf:")) {
    const key = activeFilter.slice("ccf:".length);
    return getCcfRank(p) === (key === "__blank__" ? "" : key);
  }
  if (activeFilter.startsWith("track:")) {
    const key = activeFilter.slice("track:".length);
    return getVenueTrack(p) === (key === "__blank__" ? "" : key);
  }
  if (activeFilter.startsWith("venue:")) {
    const key = decodeURIComponent(activeFilter.slice("venue:".length));
    return (getVenueName(p) || "（未填写刊会）") === key;
  }
  if (viewMode === "cat") return p.cat === activeFilter;
  return true;
}

function renderGroupedSections(pool, groupFn, sortFn, headFn) {
  const groups = new Map();
  pool.forEach(p => {
    const group = groupFn(p);
    if (!groups.has(group.key)) groups.set(group.key, { ...group, papers: [] });
    groups.get(group.key).papers.push(p);
  });
  const sorted = [...groups.values()].sort(sortFn);
  sorted.forEach(g => {
    const section = document.createElement("section");
    section.className = "section";
    const head = headFn(g);
    section.innerHTML = `
      <div class="section-head">
        <span class="section-dot" style="background:${head.color}"></span>
        <span class="section-title">${head.title}</span>
        ${head.tag ? `<span class="section-tag">${head.tag}</span>` : ""}
        <span class="section-count">${g.papers.length} 篇</span>
      </div>
      <div class="grid">${g.papers.map(renderCard).join("")}</div>`;
    main.appendChild(section);
  });
}

async function loadCitationGraph(refresh=false) {
  if (citationGraphLoading) return;
  citationGraphLoading = true;
  citationGraphError = "";
  renderFilterBar();
  render();
  try {
    const res = await fetch("/api/citation-graph" + (refresh ? "?refresh=1" : ""));
    const data = await res.json();
    if (!res.ok || data.ok === false) {
      throw new Error(data.error || data.warning || "引用图加载失败");
    }
    citationGraph = data;
    selectedGraphNodeId = selectedGraphNodeId || data.edges?.[0]?.source || data.nodes?.[0]?.id || null;
  } catch (e) {
    citationGraphError = e.message;
  } finally {
    citationGraphLoading = false;
    renderFilterBar();
    render();
  }
}

function graphShortLabel(value) {
  const s = String(value || "");
  return s.length > 16 ? s.slice(0, 15) + "…" : s;
}

function renderGraphSvg(nodes, edges) {
  const width = 1100, height = 620;
  const nodeById = new Map(nodes.map((n, i) => {
    const angle = (Math.PI * 2 * i) / Math.max(nodes.length, 1);
    const radius = 210 + (i % 5) * 18;
    return [n.id, {
      ...n,
      x: width / 2 + Math.cos(angle) * radius,
      y: height / 2 + Math.sin(angle) * radius,
      vx: 0,
      vy: 0,
    }];
  }));
  const layoutEdges = edges
    .map(e => ({ ...e, s: nodeById.get(e.source), t: nodeById.get(e.target) }))
    .filter(e => e.s && e.t);

  for (let iter = 0; iter < 90; iter++) {
    const list = [...nodeById.values()];
    for (let i = 0; i < list.length; i++) {
      for (let j = i + 1; j < list.length; j++) {
        const a = list[i], b = list[j];
        let dx = b.x - a.x, dy = b.y - a.y;
        let d2 = dx * dx + dy * dy || 1;
        const force = Math.min(3200 / d2, 1.8);
        const d = Math.sqrt(d2);
        dx /= d; dy /= d;
        a.vx -= dx * force; a.vy -= dy * force;
        b.vx += dx * force; b.vy += dy * force;
      }
    }
    layoutEdges.forEach(e => {
      const dx = e.t.x - e.s.x, dy = e.t.y - e.s.y;
      const d = Math.sqrt(dx * dx + dy * dy) || 1;
      const force = (d - 160) * 0.012;
      const fx = (dx / d) * force, fy = (dy / d) * force;
      e.s.vx += fx; e.s.vy += fy;
      e.t.vx -= fx; e.t.vy -= fy;
    });
    nodeById.forEach(n => {
      n.vx += (width / 2 - n.x) * 0.004;
      n.vy += (height / 2 - n.y) * 0.004;
      n.x = Math.max(42, Math.min(width - 42, n.x + n.vx));
      n.y = Math.max(42, Math.min(height - 42, n.y + n.vy));
      n.vx *= 0.72; n.vy *= 0.72;
    });
  }

  const degree = new Map();
  edges.forEach(e => {
    degree.set(e.source, (degree.get(e.source) || 0) + 1);
    degree.set(e.target, (degree.get(e.target) || 0) + 1);
  });
  const selected = selectedGraphNodeId;
  const edgeMarkup = layoutEdges.map(e => {
    const hi = selected && (e.source === selected || e.target === selected);
    return `<line class="graph-edge${hi ? " highlight" : ""}" x1="${e.s.x.toFixed(1)}" y1="${e.s.y.toFixed(1)}" x2="${e.t.x.toFixed(1)}" y2="${e.t.y.toFixed(1)}"></line>`;
  }).join("");
  const nodeMarkup = [...nodeById.values()].map(n => {
    const d = degree.get(n.id) || 0;
    const r = Math.min(24, 11 + d * 2 + (n.resolved ? 1 : 0));
    const color = n.color || "#64748B";
    const selectedClass = selected === n.id ? " selected" : "";
    const unresolvedClass = n.resolved ? "" : " unresolved";
    return `<g class="graph-node${selectedClass}${unresolvedClass}" onclick='selectGraphNode(${JSON.stringify(n.id)})'>
      <circle cx="${n.x.toFixed(1)}" cy="${n.y.toFixed(1)}" r="${r}" fill="${escapeHtml(color)}"></circle>
      <text x="${n.x.toFixed(1)}" y="${(n.y + r + 13).toFixed(1)}" text-anchor="middle">${escapeHtml(graphShortLabel(n.short))}</text>
    </g>`;
  }).join("");

  return `<svg class="graph-svg" viewBox="0 0 ${width} ${height}" role="img" aria-label="本地论文引用关系图">
    <defs>
      <marker id="graph-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#4B7A9E"></path>
      </marker>
    </defs>
    ${edgeMarkup}
    ${nodeMarkup}
  </svg>`;
}

function renderGraphDetail(nodes, edges) {
  const nodeMap = new Map((citationGraph?.nodes || []).map(n => [n.id, n]));
  const selected = selectedGraphNodeId ? nodeMap.get(selectedGraphNodeId) : null;
  if (!selected) {
    const topEdges = edges.slice(0, 8).map(e => {
      const s = nodeMap.get(e.source), t = nodeMap.get(e.target);
      return `<div class="graph-list-item">${escapeHtml(s?.short || e.source)} → ${escapeHtml(t?.short || e.target)}</div>`;
    }).join("");
    return `<div class="graph-side">
      <h3>引用图详情</h3>
      <div class="muted">选择一个节点查看它在本地库中的引用和被引用关系。</div>
      <div class="graph-list">${topEdges || '<div class="graph-list-item">当前筛选下没有本地互引边。</div>'}</div>
    </div>`;
  }
  const outgoing = (citationGraph?.edges || []).filter(e => e.source === selected.id);
  const incoming = (citationGraph?.edges || []).filter(e => e.target === selected.id);
  const relList = [
    ...outgoing.map(e => ({ label: "引用", node: nodeMap.get(e.target) })),
    ...incoming.map(e => ({ label: "被引用", node: nodeMap.get(e.source) })),
  ].filter(x => x.node).map(x =>
    `<div class="graph-list-item"><strong>${escapeHtml(x.label)}</strong> · ${escapeHtml(x.node.short)}<br><span class="muted">${escapeHtml(x.node.title)}</span></div>`
  ).join("");
  const openalexLink = selected.openalexUrl
    ? `<a class="link link-arxiv" href="${escapeHtml(selected.openalexUrl.replace('api.', ''))}" target="_blank">↗ OpenAlex</a>`
    : "";
  return `<div class="graph-side">
    <h3>${escapeHtml(selected.short)}</h3>
    <div class="muted">${escapeHtml(selected.title)}</div>
    <div class="graph-list">
      <div class="graph-list-item">本地引用：${outgoing.length} · 本地被引用：${incoming.length}</div>
      <div class="graph-list-item">OpenAlex：${selected.resolved ? "已匹配" : "未匹配"} · 外部参考文献：${selected.externalReferenceCount || 0}</div>
      <div class="graph-list-item">刊会：${escapeHtml(selected.venue || "未填写")} · CCF：${escapeHtml(selected.ccf || "待补充")}</div>
      ${openalexLink ? `<div class="graph-list-item">${openalexLink}</div>` : ""}
    </div>
    <div class="graph-list">${relList || '<div class="graph-list-item">这个节点当前没有本地互引关系。</div>'}</div>
  </div>`;
}

function renderGraph(pool) {
  if (!citationGraph && !citationGraphLoading && !citationGraphError) {
    loadCitationGraph(false);
  }
  const poolIds = new Set(pool.map(p => p.id));
  const graphNodes = (citationGraph?.nodes || state.papers.map(p => ({
    id: p.id, short: p.short, title: p.title, cat: p.cat,
    color: state.categories.find(c => c.id === p.cat)?.color || "#64748B",
    resolved: false,
  }))).filter(n => poolIds.has(n.id));
  const visibleIds = new Set(graphNodes.map(n => n.id));
  const graphEdges = (citationGraph?.edges || []).filter(e => visibleIds.has(e.source) && visibleIds.has(e.target));
  if (selectedGraphNodeId && !visibleIds.has(selectedGraphNodeId)) selectedGraphNodeId = graphNodes[0]?.id || null;

  const stats = citationGraph?.stats || {};
  const builtAt = citationGraph?.builtAt ? new Date(citationGraph.builtAt).toLocaleString() : "尚未生成";
  const warning = citationGraph?.warning ? `<div class="graph-pill" style="color:#F6C344">⚠ ${escapeHtml(citationGraph.warning)}</div>` : "";
  main.innerHTML = `
    <section class="section graph-shell">
      <div class="section-head">
        <span class="section-dot" style="background:#02C39A"></span>
        <span class="section-title">本地论文引用图</span>
        <span class="section-tag">OpenAlex · 本地节点互引</span>
        <span class="section-count">${graphEdges.length} 条边</span>
      </div>
      <div class="graph-summary">
        <span class="graph-pill">节点 ${graphNodes.length}/${state.papers.length}</span>
        <span class="graph-pill">已匹配 ${stats.resolvedCount ?? "..."}</span>
        <span class="graph-pill">未匹配 ${stats.unresolvedCount ?? "..."}</span>
        <span class="graph-pill">更新时间 ${escapeHtml(builtAt)}</span>
        ${warning}
        ${citationGraphError ? `<span class="graph-pill" style="color:#F87171">加载失败：${escapeHtml(citationGraphError)}</span>` : ""}
      </div>
      <div class="graph-layout">
        <div class="graph-canvas">
          ${renderGraphSvg(graphNodes, graphEdges)}
          ${citationGraphLoading ? '<div class="graph-empty"><div><strong>正在生成引用图</strong>首次生成需要访问 OpenAlex，可能需要几十秒。</div></div>' : ""}
          ${!citationGraphLoading && citationGraph && graphEdges.length === 0 ? '<div class="graph-empty"><div><strong>当前筛选下没有发现本地互引边</strong>节点仍然显示；点击“更新引用图”可重新拉取 OpenAlex 数据。</div></div>' : ""}
        </div>
        ${renderGraphDetail(graphNodes, graphEdges)}
      </div>
    </section>`;
}

async function openPaperGraph(paperId, refresh=false) {
  const paper = state.papers.find(p => p.id === paperId);
  if (!paper) return;
  currentPaperGraphId = paperId;
  selectedPaperGraphNodeId = paperId;
  paperGraphError = "";
  document.getElementById("paper-graph-backdrop").classList.add("show");

  if (!refresh && paperGraphCache.has(paperId)) {
    renderPaperGraphModal();
    return;
  }

  paperGraphLoadingId = paperId;
  renderPaperGraphModal();
  try {
    const res = await fetch(`/api/paper-graph?id=${encodeURIComponent(paperId)}${refresh ? "&refresh=1" : ""}`);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "论文图谱加载失败");
    paperGraphCache.set(paperId, data);
    selectedPaperGraphNodeId = data.center?.id || paperId;
    if (data.ok === false) paperGraphError = data.error || "OpenAlex 未匹配";
  } catch (e) {
    paperGraphError = e.message;
  } finally {
    paperGraphLoadingId = null;
    renderPaperGraphModal();
  }
}

function closePaperGraph() {
  document.getElementById("paper-graph-backdrop").classList.remove("show");
  currentPaperGraphId = null;
  selectedPaperGraphNodeId = null;
  paperGraphError = "";
}

function refreshPaperGraph() {
  if (currentPaperGraphId) openPaperGraph(currentPaperGraphId, true);
}

function selectPaperGraphNode(nodeId) {
  selectedPaperGraphNodeId = nodeId;
  renderPaperGraphModal();
}

function paperNodeUrl(node) {
  return node?.url || node?.pdfUrl || node?.doi || node?.openalexUrl || "";
}

function openalexDisplayUrl(node) {
  return node?.openalexUrl ? String(node.openalexUrl).replace("https://api.openalex.org/", "https://openalex.org/").replace("api.", "") : "";
}

function renderPaperRadialSvg(graph) {
  const center = graph?.center;
  const refs = graph?.references || [];
  const width = 980;
  const height = 720;
  const cx = width / 2;
  const cy = height / 2;
  const ringSize = 24;
  const ringCount = Math.max(1, Math.ceil(refs.length / ringSize));
  const minRadius = refs.length > 12 ? 150 : 220;
  const maxRadius = Math.min(cx, cy) - 58;
  const selectedId = selectedPaperGraphNodeId || center?.id;
  const placedRefs = refs.map((node, i) => {
    const ring = Math.floor(i / ringSize);
    const ringStart = ring * ringSize;
    const inRing = Math.min(ringSize, refs.length - ringStart);
    const idx = i - ringStart;
    const radius = ringCount === 1 ? minRadius : minRadius + (maxRadius - minRadius) * (ring / (ringCount - 1));
    const angle = -Math.PI / 2 + (Math.PI * 2 * idx) / Math.max(inRing, 1) + (ring % 2 ? Math.PI / Math.max(inRing, 1) : 0);
    return {
      ...node,
      x: cx + Math.cos(angle) * radius,
      y: cy + Math.sin(angle) * radius,
      radius: node.local ? 9 : 6,
    };
  });

  const edgeMarkup = placedRefs.map(node => {
    const cls = node.local ? " local" : "";
    return `<line class="paper-radial-edge${cls}" x1="${cx}" y1="${cy}" x2="${node.x.toFixed(1)}" y2="${node.y.toFixed(1)}"></line>`;
  }).join("");
  const refMarkup = placedRefs.map(node => {
    const selected = selectedId === node.id ? " selected" : "";
    const kind = node.local ? "local" : "external";
    const label = node.local ? node.short : (node.publicationYear || graphShortLabel(node.title));
    return `<g class="paper-graph-node ${kind}${selected}" onclick='selectPaperGraphNode(${JSON.stringify(node.id)})'>
      <title>${escapeHtml(node.title)} · 当前论文引用该论文</title>
      <circle cx="${node.x.toFixed(1)}" cy="${node.y.toFixed(1)}" r="${node.radius}" fill="${escapeHtml(node.color || "#6A9BBF")}"></circle>
      <text x="${node.x.toFixed(1)}" y="${(node.y + node.radius + 12).toFixed(1)}" text-anchor="middle">${escapeHtml(graphShortLabel(label))}</text>
    </g>`;
  }).join("");
  const centerColor = center?.color || "#68D8B5";
  const centerMarkup = center ? `<g class="paper-graph-node center${selectedId === center.id ? " selected" : ""}" onclick='selectPaperGraphNode(${JSON.stringify(center.id)})'>
    <title>${escapeHtml(center.title)}</title>
    <circle cx="${cx}" cy="${cy}" r="24" fill="${escapeHtml(centerColor)}"></circle>
    <text x="${cx}" y="${cy + 42}" text-anchor="middle">${escapeHtml(graphShortLabel(center.short))}</text>
  </g>` : "";

  return `<svg class="paper-radial-svg" viewBox="0 0 ${width} ${height}" role="img" aria-label="当前论文引用关系放射图">
    <defs>
      <marker id="paper-radial-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#315A7A"></path>
      </marker>
    </defs>
    ${edgeMarkup}
    ${refMarkup}
    ${centerMarkup}
  </svg>`;
}

function renderPaperGraphPanel(graph) {
  const nodes = graph?.nodes || [];
  const refs = graph?.references || [];
  const selected = nodes.find(n => n.id === selectedPaperGraphNodeId) || graph?.center || null;
  if (!selected) {
    return `<div class="paper-graph-panel"><h3>引用详情</h3><div class="muted">正在等待图谱数据。</div></div>`;
  }
  const isCenter = selected.id === graph.center?.id;
  const relation = isCenter ? "中心论文" : "关系：中心论文 → 引用 → 当前节点";
  const scope = isCenter ? "本地库论文" : (selected.local ? "本地库内参考文献" : "外部参考文献");
  const primaryUrl = paperNodeUrl(selected);
  const openalexUrl = openalexDisplayUrl(selected);
  const linkBits = [
    primaryUrl ? `<a class="link link-arxiv" href="${escapeHtml(primaryUrl)}" target="_blank">↗ 打开链接</a>` : "",
    openalexUrl ? `<a class="link link-arxiv" href="${escapeHtml(openalexUrl)}" target="_blank">↗ OpenAlex</a>` : "",
    selected.pdfUrl ? `<a class="link link-arxiv" href="${escapeHtml(selected.pdfUrl)}" target="_blank">↗ PDF</a>` : "",
  ].filter(Boolean).join("");
  const refList = refs.map((node, i) => {
    const active = selected.id === node.id ? " active" : "";
    const meta = [
      node.local ? "本地库" : "外部",
      node.publicationYear || "",
      node.sourceName || node.venue || "",
      node.citationCount != null ? `被引 ${node.citationCount}` : "",
    ].filter(Boolean).join(" · ");
    return `<button class="paper-ref-item${active}" onclick='selectPaperGraphNode(${JSON.stringify(node.id)})'>
      ${i + 1}. 引用 · ${escapeHtml(node.local ? node.short : graphShortLabel(node.title))}
      <span class="ref-meta">${escapeHtml(meta || "OpenAlex reference")}</span>
    </button>`;
  }).join("");

  return `<div class="paper-graph-panel">
    <h3>${escapeHtml(selected.short || selected.publicationYear || "参考文献")}</h3>
    <div class="muted">${escapeHtml(selected.title || "")}</div>
    <div class="graph-list">
      <div class="graph-list-item">${escapeHtml(relation)} · ${escapeHtml(scope)}</div>
      <div class="graph-list-item">年份：${escapeHtml(selected.publicationYear || "未知")} · 来源：${escapeHtml(selected.sourceName || selected.venue || "未知")}</div>
      <div class="graph-list-item">被引：${selected.citationCount ?? "未知"} · DOI：${escapeHtml(selected.doi || "未提供")}</div>
      ${linkBits ? `<div class="graph-list-item">${linkBits}</div>` : ""}
    </div>
    <div class="paper-ref-list">${refList || '<div class="paper-ref-item">OpenAlex 没有返回参考文献。</div>'}</div>
  </div>`;
}

function renderPaperGraphModal() {
  const paper = state.papers.find(p => p.id === currentPaperGraphId);
  const graph = currentPaperGraphId ? paperGraphCache.get(currentPaperGraphId) : null;
  const loading = paperGraphLoadingId === currentPaperGraphId;
  const content = document.getElementById("paper-graph-content");
  const title = document.getElementById("paper-graph-title");
  const subtitle = document.getElementById("paper-graph-subtitle");
  const refreshBtn = document.getElementById("paper-graph-refresh");
  if (!content) return;
  if (title) title.textContent = paper ? `知识图谱 · ${paper.short}` : "论文知识图谱";
  if (subtitle) subtitle.textContent = paper ? paper.title : "以当前论文为中心，展开它引用的参考文献。";
  if (refreshBtn) {
    refreshBtn.disabled = loading;
    refreshBtn.textContent = loading ? "正在更新..." : "更新图谱";
  }

  if (!graph && loading) {
    content.innerHTML = `<div class="paper-graph-body">
      <div class="paper-graph-canvas"><div class="paper-graph-loading"><div><strong>正在生成知识图谱</strong>正在匹配 OpenAlex 并拉取当前论文的全部参考文献。</div></div></div>
      <div class="paper-graph-panel"><h3>引用详情</h3><div class="muted">首次打开可能需要几秒钟，之后会使用本地缓存。</div></div>
    </div>`;
    return;
  }

  const stats = graph?.stats || {};
  const summary = graph ? `<div class="paper-graph-summary">
    <span class="graph-pill">参考文献 ${stats.referenceCount ?? 0}</span>
    <span class="graph-pill">本地库 ${stats.localReferenceCount ?? 0}</span>
    <span class="graph-pill">外部 ${stats.externalReferenceCount ?? 0}</span>
    <span class="graph-pill">更新时间 ${escapeHtml(graph.builtAt ? new Date(graph.builtAt).toLocaleString() : "尚未生成")}</span>
  </div>` : "";
  const errorMarkup = (paperGraphError || graph?.error)
    ? `<div class="paper-graph-error"><div><strong>图谱数据不完整</strong>${escapeHtml(paperGraphError || graph.error)}</div></div>`
    : "";
  content.innerHTML = `${summary}
    <div class="paper-graph-body">
      <div class="paper-graph-canvas">
        ${graph ? renderPaperRadialSvg(graph) : ""}
        ${loading ? '<div class="paper-graph-loading"><div><strong>正在更新知识图谱</strong>正在重新拉取 OpenAlex 数据。</div></div>' : ""}
        ${errorMarkup}
      </div>
      ${graph ? renderPaperGraphPanel(graph) : '<div class="paper-graph-panel"><h3>引用详情</h3><div class="muted">没有可显示的数据。</div></div>'}
    </div>`;
}

function autoResizeNoteEditor() {
  const editor = document.getElementById("paper-note-editor");
  if (!editor) return;
  editor.style.height = "auto";
  editor.style.height = Math.max(620, Math.min(editor.scrollHeight + 2, 2600)) + "px";
}

function openPaperNote(paperId) {
  const paper = state.papers.find(p => p.id === paperId);
  if (!paper) return;
  editingNotePaperId = paperId;
  clearTimeout(noteSaveTimer);
  const title = document.getElementById("paper-note-title");
  const subtitle = document.getElementById("paper-note-subtitle");
  const status = document.getElementById("paper-note-status");
  const editor = document.getElementById("paper-note-editor");
  title.textContent = `论文笔记 · ${paper.short}`;
  subtitle.textContent = paper.title || "Markdown / 纯文本";
  status.textContent = paper.readingNoteUpdatedAt ? `已保存 ${new Date(paper.readingNoteUpdatedAt).toLocaleString()}` : "";
  editor.value = paper.readingNote || "";
  document.getElementById("paper-note-backdrop").classList.add("show");
  setTimeout(() => { editor.focus(); autoResizeNoteEditor(); }, 0);
}

function flushPaperNoteSave() {
  if (!editingNotePaperId) return;
  const paper = state.papers.find(p => p.id === editingNotePaperId);
  const editor = document.getElementById("paper-note-editor");
  if (!paper || !editor) return;
  clearTimeout(noteSaveTimer);
  const value = editor.value;
  if ((paper.readingNote || "") === value) return;
  paper.readingNote = value;
  paper.readingNoteUpdatedAt = new Date().toISOString();
  document.getElementById("paper-note-status").textContent = "保存中...";
  saveData().then(() => {
    if (editingNotePaperId === paper.id) {
      document.getElementById("paper-note-status").textContent = `已保存 ${new Date(paper.readingNoteUpdatedAt).toLocaleString()}`;
    }
  });
}

function schedulePaperNoteSave() {
  if (!editingNotePaperId) return;
  const paper = state.papers.find(p => p.id === editingNotePaperId);
  const editor = document.getElementById("paper-note-editor");
  if (!paper || !editor) return;
  paper.readingNote = editor.value;
  paper.readingNoteUpdatedAt = new Date().toISOString();
  document.getElementById("paper-note-status").textContent = "编辑中...";
  autoResizeNoteEditor();
  clearTimeout(noteSaveTimer);
  noteSaveTimer = setTimeout(() => {
    document.getElementById("paper-note-status").textContent = "保存中...";
    saveData().then(() => {
      if (editingNotePaperId === paper.id) {
        document.getElementById("paper-note-status").textContent = `已保存 ${new Date(paper.readingNoteUpdatedAt).toLocaleString()}`;
      }
    });
  }, 700);
}

function closePaperNote() {
  flushPaperNoteSave();
  document.getElementById("paper-note-backdrop").classList.remove("show");
  editingNotePaperId = null;
  clearTimeout(noteSaveTimer);
  render();
}

function wrapNoteSelection(before, after) {
  const editor = document.getElementById("paper-note-editor");
  const start = editor.selectionStart;
  const end = editor.selectionEnd;
  const selected = editor.value.slice(start, end);
  editor.setRangeText(before + selected + after, start, end, "select");
  editor.selectionStart = start + before.length;
  editor.selectionEnd = start + before.length + selected.length;
  editor.focus();
  schedulePaperNoteSave();
}

function prefixNoteLine(prefix) {
  const editor = document.getElementById("paper-note-editor");
  const start = editor.selectionStart;
  const lineStart = editor.value.lastIndexOf("\n", Math.max(0, start - 1)) + 1;
  editor.setRangeText(prefix, lineStart, lineStart, "end");
  editor.focus();
  schedulePaperNoteSave();
}

function renderAbstractList(pool) {
  if (pool.length === 0) {
    main.innerHTML = '<div class="abstract-empty">当前筛选条件下没有论文。</div>';
    return;
  }
  const html = pool.map(p => {
    const cat = state.categories.find(c => c.id === p.cat);
    const accent = cat?.color || '#64748B';
    const titleAttr = escapeHtml(`${p.short} — ${p.title}`);
    const venueName = getVenueName(p);
    const venueMeta = getVenueTypeMeta(p.venueType);
    const ccfRank = getCcfRank(p);
    const ccfMeta = getCcfMeta(ccfRank);
    const track = getVenueTrack(p);
    const trackMeta = getVenueTrackMeta(track);

    const metaRow = [];
    if (venueName) metaRow.push(`<span class="venue-badge ${venueMeta.cls}">${escapeHtml(venueMeta.label)} · ${escapeHtml(venueName)}</span>`);
    if (track) metaRow.push(`<span class="track-badge ${trackMeta.cls}">${escapeHtml(trackMeta.label)}</span>`);
    if (ccfRank) metaRow.push(`<span class="ccf-badge ${ccfMeta.cls}">${escapeHtml(ccfMeta.label)}</span>`);
    if (p.org) metaRow.push(`<span class="org-badge ${p.orgType||''}">${p.orgType==='school'?'🎓':p.orgType==='lab'?'🔬':'🏢'} ${escapeHtml(p.org)}</span>`);

    const links = [];
    if (p.pdf) links.push(`<button class="link link-pdf" onclick="openPdf('${encodeURIComponent(p.pdf)}', '${titleAttr}', '${p.id}')">📄 PDF</button>`);
    if (p.arxiv) links.push(`<a class="link link-arxiv" href="https://arxiv.org/abs/${p.arxiv}" target="_blank">↗ arXiv</a>`);
    if (p.url) links.push(`<a class="link link-arxiv" href="${escapeHtml(p.url)}" target="_blank">↗ 链接</a>`);
    if (p.code) links.push(`<a class="link link-arxiv" href="${escapeHtml(p.code)}" target="_blank">↗ Code</a>`);

    const abstract = (p.abstract || p.note || "").trim();
    const abstractCn = (p.abstract_cn || "").trim();
    // Use tags as keywords fallback if no dedicated keywords field
    const keywords = Array.isArray(p.keywords) && p.keywords.length > 0
      ? p.keywords
      : (Array.isArray(p.tags) && p.tags.length > 0 ? p.tags.filter(t => !t.startsWith('类型:') && !t.startsWith('主系统:') && !t.startsWith('系统:') && !t.startsWith('主题:')) : []);

    return `
    <div class="abstract-item" style="--accent:${accent}" data-id="${escapeHtml(p.id)}">
      <div class="abstract-left">
        <div class="abstract-title">
          <span class="abstract-short">${escapeHtml(p.short)}</span>${escapeHtml(p.title)}
        </div>
        <div class="abstract-meta-row">${metaRow.join("")}</div>
        <div class="abstract-links">${links.join("")}</div>
      </div>
      <div class="abstract-right">
        ${abstract ? `<div class="abstract-label">Abstract</div><div class="abstract-text">${escapeHtml(abstract)}</div>` : '<div class="abstract-label">Abstract</div><div class="abstract-text" style="color:#4B7A9E;font-style:italic;">No abstract available</div>'}
        ${abstractCn ? `<div class="abstract-label" style="margin-top:14px;color:#68D8B5;">中文摘要</div><div class="abstract-text abstract-text-cn">${escapeHtml(abstractCn)}</div>` : ""}
        ${keywords.length > 0 ? `<div class="abstract-keywords"><div class="abstract-label">关键词</div>${keywords.map(k => `<span class="kw-tag">${escapeHtml(k)}</span>`).join("")}</div>` : ""}
      </div>
    </div>`;
  }).join("");
  main.innerHTML = `<div class="abstract-list">${html}</div>`;
  attachHighlightListeners();
}

function renderIntroductionList(pool) {
  if (pool.length === 0) {
    main.innerHTML = '<div class="abstract-empty">当前筛选条件下没有论文。</div>';
    return;
  }
  const html = pool.map(p => {
    const cat = state.categories.find(c => c.id === p.cat);
    const accent = cat?.color || '#64748B';
    const titleAttr = escapeHtml(`${p.short} — ${p.title}`);
    const venueName = getVenueName(p);
    const venueMeta = getVenueTypeMeta(p.venueType);
    const ccfRank = getCcfRank(p);
    const ccfMeta = getCcfMeta(ccfRank);
    const track = getVenueTrack(p);
    const trackMeta = getVenueTrackMeta(track);

    const metaRow = [];
    if (venueName) metaRow.push(`<span class="venue-badge ${venueMeta.cls}">${escapeHtml(venueMeta.label)} · ${escapeHtml(venueName)}</span>`);
    if (track) metaRow.push(`<span class="track-badge ${trackMeta.cls}">${escapeHtml(trackMeta.label)}</span>`);
    if (ccfRank) metaRow.push(`<span class="ccf-badge ${ccfMeta.cls}">${escapeHtml(ccfMeta.label)}</span>`);
    if (p.org) metaRow.push(`<span class="org-badge ${p.orgType||''}">${p.orgType==='school'?'🎓':p.orgType==='lab'?'🔬':'🏢'} ${escapeHtml(p.org)}</span>`);

    const links = [];
    if (p.pdf) links.push(`<button class="link link-pdf" onclick="openPdf('${encodeURIComponent(p.pdf)}', '${titleAttr}', '${p.id}')">📄 PDF</button>`);
    if (p.arxiv) links.push(`<a class="link link-arxiv" href="https://arxiv.org/abs/${p.arxiv}" target="_blank">↗ arXiv</a>`);
    if (p.url) links.push(`<a class="link link-arxiv" href="${escapeHtml(p.url)}" target="_blank">↗ 链接</a>`);
    if (p.code) links.push(`<a class="link link-arxiv" href="${escapeHtml(p.code)}" target="_blank">↗ Code</a>`);

    let intro = (p.introduction || "").trim();
    
    // Convert citation references [N] to clickable links that open in right panel
    intro = intro.replace(/\[(\d+(?:\s*,\s*\d+)*)\]/g, (match, citationList) => {
      const nums = citationList.split(/\s*,\s*/).map(n => n.trim());
      const links = nums.map(num => {
        const searchQuery = encodeURIComponent(`${p.title} citation ${num}`);
        return `<span class="intro-citation-link" onclick="openCiteUrl('https://scholar.google.com/scholar?q=${searchQuery}', '引用 [${num}] - ${escapeHtml(p.short)}')">[${num}]</span>`;
      });
      return links.join(', ');
    });
    
    // Convert author-year citations (Author et al., Year) to clickable
    intro = intro.replace(/\(([A-Z][a-z]+(?:\s+et\s+al\.)?),\s*(\d{4}[a-z]?)\)/g, (match, author, year) => {
      const searchQuery = encodeURIComponent(`${author.replace(' et al.', '')} ${year}`);
      return `<span class="intro-citation-link" onclick="openCiteUrl('https://scholar.google.com/scholar?q=${searchQuery}', '${author}, ${year}')">(${author}, ${year})</span>`;
    });
    
    // Convert arXiv references to clickable links
    intro = intro.replace(/arXiv:(\d{4}\.\d{4,5})/gi, (match, arxivId) => {
      return `<span class="intro-citation-link" onclick="openCiteUrl('https://arxiv.org/abs/${arxivId}', 'arXiv:${arxivId}')">arXiv:${arxivId}</span>`;
    });
    
    // Convert URLs to clickable links
    intro = intro.replace(/(https?:\/\/[^\s\)\]\>]+)/g, (match, url) => {
      const cleanUrl = url.replace(/[.,;]$/, '');
      return `<span class="intro-citation-link" onclick="openCiteUrl('${cleanUrl}', '${cleanUrl}')">${cleanUrl}</span>`;
    });

    return `
    <div class="abstract-item intro-item" style="--accent:${accent}" data-id="${escapeHtml(p.id)}">
      <div class="abstract-left">
        <div class="abstract-title">
          <span class="abstract-short">${escapeHtml(p.short)}</span>${escapeHtml(p.title)}
        </div>
        <div class="abstract-meta-row">${metaRow.join("")}</div>
        <div class="abstract-links">${links.join("")}</div>
      </div>
      <div class="abstract-right">
        ${intro ? `<div class="abstract-label">Introduction</div><div class="abstract-text intro-text">${intro}</div>` : '<div class="abstract-label">Introduction</div><div class="abstract-text" style="color:#4B7A9E;font-style:italic;">暂无 Introduction</div>'}
      </div>
    </div>`;
  }).join("");
  main.innerHTML = `<div class="abstract-list">${html}</div>`;
  attachHighlightListeners();
}

function attachHighlightListeners() {
  const abstractTexts = document.querySelectorAll('.abstract-text');
  abstractTexts.forEach(el => {
    el.addEventListener('mouseup', handleTextSelection);
    el.addEventListener('click', handleHighlightClick);
  });
}

function handleTextSelection(e) {
  const selection = window.getSelection();
  if (!selection || selection.isCollapsed) return;
  
  const selectedText = selection.toString().trim();
  if (!selectedText) return;
  
  // Check if selection is within abstract-text
  const container = e.currentTarget;
  if (!container.contains(selection.anchorNode)) return;
  
  try {
    const range = selection.getRangeAt(0);
    
    // Don't highlight if already inside a highlight
    if (range.commonAncestorContainer.parentElement?.classList?.contains('highlight-yellow')) {
      selection.removeAllRanges();
      return;
    }
    
    const span = document.createElement('span');
    span.className = 'highlight-yellow';
    span.title = '点击取消高亮';
    
    range.surroundContents(span);
    selection.removeAllRanges();
  } catch (err) {
    // Complex selection (crosses elements) - ignore
    selection.removeAllRanges();
  }
}

function handleHighlightClick(e) {
  if (e.target.classList.contains('highlight-yellow')) {
    const highlight = e.target;
    const parent = highlight.parentNode;
    
    // Replace highlight span with its text content
    const textNode = document.createTextNode(highlight.textContent);
    parent.replaceChild(textNode, highlight);
    parent.normalize();
  }
}

function render() {
  main.innerHTML = "";
  const q = document.getElementById("search").value.trim().toLowerCase();
  let pool = state.papers.filter(p => matchQuery(p, q));
  if (activeFilter !== "all") pool = pool.filter(matchesActiveFilter);

  if (viewMode === "abstract") {
    renderAbstractList(pool);
    updateActiveCard();
    return;
  }

  if (viewMode === "introduction") {
    renderIntroductionList(pool);
    updateActiveCard();
    return;
  }

  if (viewMode === "graph") {
    renderGraph(pool);
    return;
  }

  if (viewMode === "org") {
    const orderMap = { company: 0, school: 1, lab: 2, "": 3 };
    renderGroupedSections(
      pool,
      p => ({ key: p.org || "（未指定机构）", org: p.org || "", orgType: p.orgType || "" }),
      (a, b) => {
        const oa = orderMap[a.orgType ?? ""] ?? 9, ob = orderMap[b.orgType ?? ""] ?? 9;
        if (oa !== ob) return oa - ob;
        if (b.papers.length !== a.papers.length) return b.papers.length - a.papers.length;
        return a.key.localeCompare(b.key);
      },
      g => {
        const typeBadge = g.orgType === "company" ? '<span class="org-badge company">🏢 公司</span>'
                        : g.orgType === "school"  ? '<span class="org-badge school">🎓 学校</span>'
                        : g.orgType === "lab"     ? '<span class="org-badge lab">🔬 实验室</span>' : '';
        return {
          color: g.orgType === "school" ? "#60A5FA" : g.orgType === "lab" ? "#FBBF24" : "#C084FC",
          title: `${typeBadge}${escapeHtml(g.key)}`,
        };
      }
    );
    updateActiveCard();
    return;
  }

  if (viewMode === "venueType") {
    renderGroupedSections(
      pool,
      p => {
        const key = normalizeVenueType(p.venueType);
        return { key, meta: getVenueTypeMeta(key) };
      },
      (a, b) => a.meta.order - b.meta.order || b.papers.length - a.papers.length,
      g => ({ color: g.meta.color, title: escapeHtml(g.meta.label) })
    );
    updateActiveCard();
    return;
  }

  if (viewMode === "ccf") {
    renderGroupedSections(
      pool,
      p => {
        const key = getCcfRank(p);
        return { key, meta: getCcfMeta(key) };
      },
      (a, b) => a.meta.order - b.meta.order || b.papers.length - a.papers.length,
      g => ({ color: g.meta.color, title: escapeHtml(g.meta.label) })
    );
    updateActiveCard();
    return;
  }

  if (viewMode === "track") {
    renderGroupedSections(
      pool,
      p => {
        const key = getVenueTrack(p);
        return { key, meta: getVenueTrackMeta(key) };
      },
      (a, b) => a.meta.order - b.meta.order || b.papers.length - a.papers.length,
      g => ({ color: g.meta.color, title: escapeHtml(g.meta.label) })
    );
    updateActiveCard();
    return;
  }

  if (viewMode === "venue") {
    renderGroupedSections(
      pool,
      p => {
        const venue = getVenueName(p) || "（未填写刊会）";
        return { key: venue, venueType: normalizeVenueType(p.venueType), meta: getVenueTypeMeta(p.venueType) };
      },
      (a, b) => {
        if (a.key === "（未填写刊会）") return 1;
        if (b.key === "（未填写刊会）") return -1;
        if (b.papers.length !== a.papers.length) return b.papers.length - a.papers.length;
        return a.key.localeCompare(b.key);
      },
      g => ({ color: g.meta.color, title: escapeHtml(g.key), tag: escapeHtml(g.meta.label) })
    );
    updateActiveCard();
    return;
  }

  const sections = (activeFilter === "all" || activeFilter === "starred" || activeFilter.startsWith("type:"))
    ? state.categories
    : state.categories.filter(c => c.id === activeFilter);

  for (const s of sections) {
    const subset = pool.filter(p => p.cat === s.id);
    if (subset.length === 0) continue;
    const section = document.createElement("section");
    section.className = "section";
    section.innerHTML = `
      <div class="section-head">
        <span class="section-dot" style="background:${s.color}"></span>
        <span class="section-title">${escapeHtml(s.title)}</span>
        <span class="section-tag">${escapeHtml(s.tag)}</span>
        <span class="section-count">${subset.length} 篇</span>
      </div>
      <div class="grid">${subset.map(renderCard).join("")}</div>`;
    main.appendChild(section);
  }
  updateActiveCard();
}

function savePaper() {

  const venue = document.getElementById("f-venue").value.trim();
  const venueType = document.getElementById("f-venueType").value || null;
  const ccf = document.getElementById("f-ccf").value || inferCcfFromVenue(venue);
  const venueTrack = document.getElementById("f-venueTrack").value || inferVenueTrack(venue, venueType);
  const existing = editingId ? state.papers.find(x=>x.id===editingId) : null;
  const data = {
    id: editingId||(short.toLowerCase().replace(/[^a-z0-9]+/g,"-")+"-"+Date.now().toString(36)),
    type: document.getElementById("f-type").value,
    cat: document.getElementById("f-cat").value,
    short, title,
    note: document.getElementById("f-note").value.trim(),
    venue: venue||null,
    venueType,
    venueTrack: venueTrack||null,
    ccf: ccf||null,
    arxiv: document.getElementById("f-arxiv").value.trim()||null,
    url: document.getElementById("f-url").value.trim()||null,
    pdf: document.getElementById("f-pdf").value.trim()||null,
    thumb: document.getElementById("f-thumb").value.trim()||null,
    org: document.getElementById("f-org").value.trim()||null,
    orgType: document.getElementById("f-orgType").value||null,
    star: document.getElementById("f-star").checked,
  };
  if (Array.isArray(existing?.tags)) data.tags = existing.tags;
  if (existing && existing.rating !== undefined) data.rating = existing.rating;
  if (existing && existing.readingNote !== undefined) data.readingNote = existing.readingNote;
  if (existing && existing.readingNoteUpdatedAt !== undefined) data.readingNoteUpdatedAt = existing.readingNoteUpdatedAt;
  if (editingId) {
    const idx = state.papers.findIndex(x=>x.id===editingId);
    if (idx>=0) state.papers[idx]=data;
  } else {
    state.papers.push(data);
  }
  saveData(); closeModal(); renderFilterBar(); render();
}

function saveCategory() {
  const editId = document.getElementById("cat-edit-id").value;
  const title = document.getElementById("cat-title").value.trim();
  const tag = document.getElementById("cat-tag").value.trim();
  const color = document.getElementById("cat-color").value;
  if (!title) { alert("类名不能为空"); return; }
  if (editId) {
    const c = state.categories.find(x=>x.id===editId);
    if (c) { c.title=title; c.tag=tag; c.color=color; }
  } else {
    const id = "cat-" + Date.now().toString(36).slice(-4) + Math.random().toString(36).slice(2,5);
    state.categories.push({id,title,tag,color});
  }
  saveData(); renderCategoryList(); resetCatForm(); populateCatSelect(); renderFilterBar(); render();
}

function deleteCategory(id) {
  const c = state.categories.find(x=>x.id===id); if (!c) return;
  const count = state.papers.filter(p=>p.cat===id).length;
  if (count>0) {
    const fallback = state.categories.find(x=>x.id!==id);
    if (!fallback) { alert("至少保留一个分类"); return; }
    if (!confirm(`"${c.title}" 下有 ${count} 篇论文，删除后将移动到 "${fallback.title}"，继续？`)) return;
    state.papers.forEach(p=>{ if(p.cat===id) p.cat=fallback.id; });
  } else {
    if (!confirm(`删除分类 "${c.title}" ?`)) return;
  }
  state.categories = state.categories.filter(x=>x.id!==id);
  if (activeFilter!=="all"&&!activeFilter.startsWith("type:")&&!state.categories.some(c=>c.id===activeFilter)) activeFilter="all";
  saveData(); renderCategoryList(); populateCatSelect(); renderFilterBar(); render();
}

async function fetchArxiv() {
  const raw = document.getElementById("a-arxiv-input").value.trim();
  if (!raw) return;
  const status = document.getElementById("a-arxiv-status");
  const fetchBtn = document.getElementById("a-fetch-btn");
  status.style.display = "";
  status.style.background = "#0D1B2A";
  status.style.color = "#F6C344";
  status.textContent = "⟳ 正在获取元数据并下载 PDF...";
  document.getElementById("a-arxiv-preview").style.display = "none";
  fetchBtn.disabled = true;
  _addArxivMeta = null;
  _updateAddSubmitBtn();
  try {
    const res = await fetch("/api/arxiv", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id: raw }),
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || "获取失败");
    _addArxivMeta = data;
    _addPdf = data.pdf; _addThumb = data.thumb;
    // Fill optional fields from arXiv metadata
    if (!document.getElementById("a-title").value) document.getElementById("a-title").value = data.title || "";
    if (!document.getElementById("a-short").value && data.title) {
      document.getElementById("a-short").value = data.title.split(/\s+/)[0].replace(/[^A-Za-z0-9]/g, "") || "";
    }
    if (!document.getElementById("a-arxiv-id").value) document.getElementById("a-arxiv-id").value = data.arxiv || "";
    if (!document.getElementById("a-pdf").value && data.pdf) document.getElementById("a-pdf").value = data.pdf;
    if (!document.getElementById("a-thumb").value && data.thumb) document.getElementById("a-thumb").value = data.thumb;
    if (!document.getElementById("a-org").value && data.org) document.getElementById("a-org").value = data.org;
    // Show preview
    document.getElementById("a-preview-title").textContent = data.title || data.arxiv;
    document.getElementById("a-preview-authors").textContent =
      (data.authors || []).slice(0, 4).join(", ") + (data.authors?.length > 4 ? " et al." : "") +
      (data.year ? "  (" + data.year + ")" : "");
    const thumbWrap = document.getElementById("a-preview-thumb-wrap");
    const thumbImg = document.getElementById("a-preview-thumb");
    if (data.thumb) {
      thumbImg.src = "references/thumbs/" + encodeURIComponent(data.thumb);
      thumbWrap.style.display = "";
    } else { thumbWrap.style.display = "none"; }
    document.getElementById("a-arxiv-preview").style.display = "";
    status.style.color = "#02C39A";
    status.textContent = "✓ PDF 已下载，arXiv ID: " + data.arxiv;
    _updateAddSubmitBtn();
  } catch (e) {
    status.style.color = "#F87171";
    status.textContent = "✗ " + e.message;
  } finally {
    fetchBtn.disabled = false;
  }
}

async function _doLocalUpload(file) {
  document.getElementById("add-upload-idle").style.display = "none";
  document.getElementById("add-upload-busy").style.display = "";
  document.getElementById("add-upload-done").style.display = "none";
  _addPdf = null; _addThumb = null;
  _updateAddSubmitBtn();
  try {
    const res = await fetch("/api/upload", {
      method: "POST",
      headers: { "Content-Type": "application/octet-stream", "X-Filename": encodeURIComponent(file.name) },
      body: file,
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || "上传失败");
    _addPdf = data.pdf; _addThumb = data.thumb;
    document.getElementById("add-upload-busy").style.display = "none";
    document.getElementById("add-upload-done").style.display = "";
    const thumbImg = document.getElementById("add-thumb-preview");
    if (data.thumb) { thumbImg.src = "references/thumbs/" + encodeURIComponent(data.thumb); thumbImg.style.display = ""; }
    document.getElementById("add-done-name").textContent = "✓ " + data.pdf;
    if (!document.getElementById("a-pdf").value) document.getElementById("a-pdf").value = data.pdf || "";
    if (data.thumb && !document.getElementById("a-thumb").value) document.getElementById("a-thumb").value = data.thumb;
    // Auto-fill title: prefer server-extracted, fall back to filename hint
    if (!document.getElementById("a-title").value) {
      if (data.title) {
        document.getElementById("a-title").value = data.title;
      } else {
        const stem = file.name.replace(/\.pdf$/i, "");
        const hint = stem.replace(/\b\d{4}\.\d{4,5}(v\d+)?\b/g, "").replace(/[_\-]+/g, " ").trim();
        if (hint) document.getElementById("a-title").value = hint;
      }
    }
    if (data.org && !document.getElementById("a-org").value) document.getElementById("a-org").value = data.org;
    if (data.arxiv && !document.getElementById("a-arxiv-id").value) document.getElementById("a-arxiv-id").value = data.arxiv;
    // 从标题推断简称
    if (!document.getElementById("a-short").value) {
      const tv = document.getElementById("a-title").value;
      if (tv) document.getElementById("a-short").value = tv.split(/\s+/)[0].replace(/[^A-Za-z0-9]/g, "") || "";
    }
    _updateAddSubmitBtn();
  } catch (e) {
    document.getElementById("add-upload-busy").style.display = "none";
    document.getElementById("add-upload-idle").style.display = "";
    document.getElementById("add-upload-idle").innerHTML =
      `<div style="color:#F87171;margin-bottom:6px">✗ ${escapeHtml(e.message)}</div><div style="color:#4B7A9E;font-size:11px">点击重试</div>`;
  }
}

  const venue = document.getElementById("a-venue").value.trim();

  const venueTrack = document.getElementById("a-venueTrack").value || inferVenueTrack(venue, venueType);

  if (_addTab === "web") {
    const url = document.getElementById("a-url-input").value.trim();
    if (!url) { alert("请填写产品/公司链接"); return; }
    let short = document.getElementById("a-short").value.trim();
    let title = document.getElementById("a-title").value.trim();
    if (!short || !title) {
      try {
        const host = new URL(url.startsWith("http") ? url : "https://" + url).hostname.replace(/^www\./, "");
        short = short || host.split(".")[0];
        title = title || short;
      } catch (_) { short = short || "web"; title = title || short; }
    }
    state.papers.push({
      id: short.toLowerCase().replace(/[^a-z0-9]+/g, "-") + "-" + Date.now().toString(36),
      type: "product", cat, short, title, star: document.getElementById("a-star").checked,
      note: document.getElementById("a-note").value.trim() || null,
      venue: venue || null,
      venueType,
      venueTrack: venueTrack || null,
      ccf: ccf || null,
      arxiv: null, pdf: null, url,
      thumb: document.getElementById("a-thumb").value.trim() || null,
      org: document.getElementById("a-org").value.trim() || null,
      orgType: document.getElementById("a-orgType").value || null,
      rating: null,
      readingNote: "",
    });
  } else {
    // local PDF or arXiv
    const titleRaw = document.getElementById("a-title").value.trim();
    const stem = _addPdf ? _addPdf.replace(/\.pdf$/i, "") : "";
    const title = titleRaw || (_addArxivMeta?.title) || stem.replace(/[_\-]+/g, " ").trim();
    const shortRaw = document.getElementById("a-short").value.trim();
    const short = shortRaw || title.split(/\s+/)[0].replace(/[^A-Za-z0-9]/g, "") || stem;
    state.papers.push({
      id: short.toLowerCase().replace(/[^a-z0-9]+/g, "-") + "-" + Date.now().toString(36),
      type: "paper", cat, short, title, star: document.getElementById("a-star").checked,
      note: document.getElementById("a-note").value.trim() || null,
      venue: venue || null,
      venueType,
      venueTrack: venueTrack || null,
      ccf: ccf || null,
      arxiv: document.getElementById("a-arxiv-id").value.trim() || _addArxivMeta?.arxiv || null,
      pdf: document.getElementById("a-pdf").value.trim() || _addPdf || null,
      url: null,
      thumb: document.getElementById("a-thumb").value.trim() || _addThumb || null,
      org: document.getElementById("a-org").value.trim() || null,
      orgType: document.getElementById("a-orgType").value || null,
      rating: null,
      readingNote: "",
    });
  }
  await saveData(); closeAddModal(); renderFilterBar(); render();
}

document.getElementById("add-modal-backdrop").addEventListener("click", e => {
  if (e.target.id === "add-modal-backdrop") closeAddModal();
});

async function fetchOgImage() {
  const url = document.getElementById("a-url-input").value.trim();
  if (!url) return;
  const status = document.getElementById("a-og-status");
  const btn = document.getElementById("a-og-btn");
  status.style.display = "";
  status.style.background = "#0D1B2A";
  status.style.color = "#F6C344";
  status.textContent = "⟳ 正在获取页面缩略图...";
  document.getElementById("a-og-preview").style.display = "none";
  btn.disabled = true;
  try {
    const res = await fetch("/api/fetch-og", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ url }),
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || "获取失败");
    if (!document.getElementById("a-thumb").value && data.thumb) document.getElementById("a-thumb").value = data.thumb;
    if (data.thumb) {
      document.getElementById("a-og-thumb").src = "references/thumbs/" + encodeURIComponent(data.thumb);
      document.getElementById("a-og-preview").style.display = "";
    }
    if (!document.getElementById("a-title").value && data.title) document.getElementById("a-title").value = data.title;
    if (!document.getElementById("a-org").value && data.org) document.getElementById("a-org").value = data.org;
    if (!document.getElementById("a-short").value) {
      const name = data.org || data.title || "";
      if (name) document.getElementById("a-short").value = name.split(/[\s\-_]+/)[0].replace(/[^A-Za-z0-9]/g, "");
    }
    status.style.color = "#02C39A";
    status.textContent = "✓ 缩略图已下载";
  } catch (e) {
    status.style.color = "#F87171";
    status.textContent = "✗ " + e.message + "（可手动填写缩略图文件名）";
  } finally {
    btn.disabled = false;
  }
}

window.openAddModal = openAddModal;
window.closeAddModal = closeAddModal;
window.fetchArxiv = fetchArxiv;
window.fetchOgImage = fetchOgImage;
window.submitAdd = submitAdd;
window.switchAddTab = switchAddTab;

loadData();
</script>
